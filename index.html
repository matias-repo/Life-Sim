  const open=bpPanel.classList.toggle('open');
  document.getElementById('btnBless').classList.toggle('active',open);
  if(open) bpRenderList();
});

function blessingMatches(bl, e) {
  if(bl.target==='all')                      return e.type!==TYPE.PLANT;
  if(bl.target==='type:0')                   return e.type===TYPE.PLANT;
  if(bl.target==='type:1')                   return e.type===TYPE.GRAZER;
  if(bl.target==='type:2')                   return e.type===TYPE.HUNTER;
  if(bl.target==='type:3')                   return e.type===TYPE.SPIDER;
  if(bl.target.startsWith('arch:'))          return getArchetype(e.type,e.genes)===bl.target.slice(5);
  return false;
}

// Speed buttons
const speedBtns=[
  [document.getElementById('speed1'), 1],
  [document.getElementById('speed2'), 2],
  [document.getElementById('speed4'), 4],
  [document.getElementById('speed8'), 8],
  [document.getElementById('speed16'),16],
  [document.getElementById('speed32'),32],
];
speedBtns.forEach(([btn,spd])=>{
  btn.addEventListener('click',()=>{
    simSpeed=spd;
    speedBtns.forEach(([b])=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// Canvas click — inspect or place (convert to world coords via cam)
canvas.addEventListener('click', ev=>{
  if(_panning) return; // suppress click when pan just finished
  const rect=canvas.getBoundingClientRect();
  const mx=ev.clientX-rect.left+cam.x, my=ev.clientY-rect.top+cam.y; // world coords
  const pt={x:mx,y:my};

  // Gene-edit buttons (checked before entity inspect so clicks on panel don't deselect)
  if(inspected && !inspected.dead){
    for(const btn of inspectButtons){
      if(mx>=btn.x && mx<=btn.x+btn.w && my>=btn.y && my<=btn.y+btn.h){
        const step=(btn.hi-btn.lo)*0.05;
        inspected.genes[btn.key]=clamp(inspected.genes[btn.key]+btn.delta*step, btn.lo, btn.hi);
        if(btn.key==='size') inspected.maxEnergy=energyMax(inspected.type,inspected.genes);
        return;
      }
    }
  }

  // Inspect
  for(let i=entities.length-1;i>=0;i--){
    const e=entities[i];
    if(!e.dead && dist(pt,e)<e.genes.size+7){
      inspected=inspected===e?null:e; return;
    }
  }

  // Place entity
  if(selected!==null){
    for(let i=0;i<3;i++){
      const x=clamp(mx+(Math.random()-0.5)*30,5,WORLD_W-5);
      const y=clamp(my+(Math.random()-0.5)*30,5,WORLD_H-5);
      entities.push(createEntity(selected,x,y,randomGenes(selected)));
    }
  } else if(selStruct!==null){
    structures.push({type:selStruct, x:mx, y:my});
  } else {
    inspected=null;
  }
});

// Right-click / middle-click drag to pan the camera
let _panning=false, _panStart=null;
canvas.addEventListener('mousedown', ev=>{
  if(ev.button===2||ev.button===1){
    _panStart={mx:ev.clientX, my:ev.clientY, cx:cam.x, cy:cam.y};
    ev.preventDefault();
  }
});
canvas.addEventListener('mousemove', ev=>{
  if(!_panStart) return;
  _panning=true;
  cam.x=clamp(_panStart.cx-(ev.clientX-_panStart.mx), 0, WORLD_W-canvas.width);
  cam.y=clamp(_panStart.cy-(ev.clientY-_panStart.my), 0, WORLD_H-canvas.height);
});
canvas.addEventListener('mouseup',   ()=>{ _panStart=null; setTimeout(()=>_panning=false,10); });
canvas.addEventListener('mouseleave',()=>{ _panStart=null; _panning=false; });
canvas.addEventListener('contextmenu', ev=>ev.preventDefault());

document.getElementById('btnPause').addEventListener('click',()=>{
  paused=!paused;
  const btn=document.getElementById('btnPause');
  btn.textContent=paused?'▶ Resume':'⏸ Pause';
  btn.classList.toggle('paused',paused);
});

document.getElementById('btnClear').addEventListener('click',()=>{
  entities=[]; nutrients=[]; spores=[]; corpses=[]; structures=[]; history=[]; inspected=null; webs=[];
  maxGeneration=0; maxGenByType=[0,0,0,0]; geneBank=[[],[],[],[]];
  eventLog.length=0; Object.keys(milestoneHit).forEach(k=>delete milestoneHit[k]); lastLoggedGen=0; tick=0;
  genFertZones();
  document.getElementById('st-gen').textContent='gen: 0';
  localStorage.removeItem(SAVE_KEY);
});

const btnHeat=document.getElementById('btnHeat');
function cycleHeatmap(){
  heatmap=(heatmap+1)%HEATMAP_MODES.length;
  btnHeat.classList.toggle('active',heatmap>0);
  btnHeat.textContent=heatmap>0?`◉ ${HEATMAP_MODES[heatmap].name}`:'◉ Heat';
}
btnHeat.addEventListener('click',cycleHeatmap);
document.addEventListener('keydown',ev=>{
  if(ev.key==='h'||ev.key==='H'){ cycleHeatmap(); return; }
  const PAN=120;
  if(ev.key==='ArrowLeft')  cam.x=clamp(cam.x-PAN, 0, WORLD_W-canvas.width);
  if(ev.key==='ArrowRight') cam.x=clamp(cam.x+PAN, 0, WORLD_W-canvas.width);
  if(ev.key==='ArrowUp')    cam.y=clamp(cam.y-PAN, 0, WORLD_H-canvas.height);
  if(ev.key==='ArrowDown')  cam.y=clamp(cam.y+PAN, 0, WORLD_H-canvas.height);
});

const btnGoal=document.getElementById('btnGoal');
btnGoal.addEventListener('click',()=>{
  challengeIdx=(challengeIdx+1)%CHALLENGES.length;
  const def=CHALLENGES[challengeIdx];
  if(!def){ challenge=null; btnGoal.classList.remove('active'); btnGoal.textContent='⚑ Goal'; return; }
  challenge={...def, startTick:tick, sustainStart:null, achieved:false};
  btnGoal.classList.add('active');
  btnGoal.textContent=`⚑ ${def.target>=1000?(def.type==='gen'?'gen '+def.target:'sustain '+def.target/1000+'k'):def.target}`;
});

// ── Persistence ───────────────────────────────────────────────────────────────
const SAVE_KEY = 'biosphere_v1';

function saveState() {
  const data = {
    idCounter, maxGeneration,
    entities: entities.map(e => ({
      id: e.id, type: e.type, x: e.x, y: e.y,
      vx: e.vx, vy: e.vy, genes: e.genes,
      energy: e.energy, age: e.age, generation: e.generation
    })),
    nutrients: nutrients.map(n => ({ x: n.x, y: n.y, amount: n.amount })),
    history
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch(_) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    idCounter     = d.idCounter     ?? 0;
    maxGeneration = d.maxGeneration ?? 0;
    entities = (d.entities ?? []).map(s => ({
      id: s.id, type: s.type,
      x: clamp(s.x, 5, WORLD_W-5),
      y: clamp(s.y, 5, WORLD_H-5),
      vx: s.vx, vy: s.vy, genes: s.genes,
      energy: s.energy, maxEnergy: energyMax(s.type, s.genes),
      age: s.age, dead: false, target: null,
      generation: s.generation, fleeing: false
    }));
    nutrients = d.nutrients ?? [];
    history   = d.history   ?? [];
    return true;
  } catch(_) { return false; }
}

// ── Boot ───────────────────────────────────────────────────────────────────────
resize();
genFertZones();
if (!loadState()) seed();
setInterval(saveState, 15000);
loop();
</script>
