<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biosphere</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #07070f; color: #ccc; font-family: monospace;
    display: flex; flex-direction: column; align-items: center;
    height: 100vh; overflow: hidden; user-select: none;
  }

  h1 { font-size: 0.85rem; letter-spacing: 6px; padding: 5px 0 3px;
       color: #4af; opacity: 0.55; flex-shrink: 0; }

  #world { display: block; cursor: crosshair; flex-shrink: 0; }

  /* ── Toolbar ──────────────────────────────────────────── */
  #ui {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 8px; flex-wrap: wrap; justify-content: center; flex-shrink: 0;
  }
  .sep { width: 1px; height: 22px; background: #1e1e2e; margin: 0 3px; flex-shrink: 0; }

  button {
    padding: 4px 12px; border: 1px solid; border-radius: 3px;
    background: transparent; font-family: monospace; font-size: 0.76rem;
    cursor: pointer; transition: background 0.12s, opacity 0.12s;
    flex-shrink: 0;
  }
  button:hover { filter: brightness(1.25); }

  /* Spawn buttons */
  .btn-plant  { color: #4c4; border-color: #2a4a2a; }
  .btn-grazer { color: #4af; border-color: #1a3a5a; }
  .btn-hunter { color: #f64; border-color: #5a2a1a; }
  .btn-plant.active  { background: rgba(68,204,68, 0.18); border-color: #4c4; }
  .btn-grazer.active { background: rgba(68,170,255,0.18); border-color: #4af; }
  .btn-hunter.active { background: rgba(255,102,68, 0.18); border-color: #f64; }

  /* Speed buttons */
  .btn-speed { color: #555; border-color: #1e1e2e; font-size: 0.72rem; padding: 4px 9px; }
  .btn-speed.active { color: #fa4; border-color: #fa4; background: rgba(255,170,68,0.12); }

  /* Util buttons */
  .btn-pause { color: #888; border-color: #333; }
  .btn-pause.paused { color: #fa4; border-color: #fa4; }
  .btn-clear { color: #555; border-color: #222; }

  /* ── Stats ────────────────────────────────────────────── */
  #stats {
    font-size: 0.68rem; color: #383848; padding: 1px 8px 4px;
    letter-spacing: 0.5px; flex-shrink: 0;
  }
  #stats span { margin-right: 14px; }
  #stats .s-plant  { color: #2a4a2a; }
  #stats .s-grazer { color: #1a3a5a; }
  #stats .s-hunter { color: #4a2a18; }
  .btn-heat { color: #688; border-color: #222; }
  .btn-heat.active { color: #f8c; border-color: #f8c; background: rgba(255,136,204,0.12); }
  .btn-goal { color: #665; border-color: #222; }
  .btn-goal.active { color: #ffd040; border-color: #886010; background: rgba(255,208,64,0.10); }
  .btn-nest  { color: #c8903a; border-color: #4a3010; }
  .btn-nest.active  { background: rgba(200,144,58,0.18); border-color: #c8903a; }
  .btn-roost { color: #9070d0; border-color: #301870; }
  .btn-roost.active { background: rgba(144,112,208,0.18); border-color: #9070d0; }
  .btn-disease { color: #6da; border-color: #1a3a1a; }
  .btn-disease.active { background: rgba(80,220,120,0.15); border-color: #6da; }
  .btn-spider { color: #c8a060; border-color: #4a3010; }
  .btn-spider.active { background: rgba(200,160,80,0.18); border-color: #c8a060; }
  #stats .s-spider { color: #8a6028; }

  /* ── Disease Panel ────────────────────────────────────────── */
  #diseasePanel {
    position: fixed; top: 90px; right: 10px; width: 210px;
    background: #080f08; border: 1px solid #1e3a1e; border-radius: 4px;
    padding: 9px 10px; font-family: monospace; font-size: 0.73rem;
    color: #7bc; z-index: 200; display: none; pointer-events: auto;
  }
  #diseasePanel.open { display: block; }
  #diseasePanel .dp-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 7px; padding-bottom: 5px; border-bottom: 1px solid #1a3a1a;
  }
  #diseasePanel .dp-title { color: #9de; letter-spacing: 2px; font-size: 0.76rem; }
  #diseasePanel .dp-close { cursor: pointer; color: #445; font-size: 0.82rem; line-height:1; }
  #diseasePanel .dp-close:hover { color: #999; }
  #diseasePanel label { display: block; color: #4a7; font-size: 0.68rem; margin: 5px 0 2px; }
  #diseasePanel select {
    width: 100%; background: #05090a; color: #9de; border: 1px solid #1e3a1e;
    border-radius: 2px; padding: 2px 4px; font-family: monospace; font-size: 0.72rem;
  }
  #diseasePanel .cond-row { display: flex; gap: 5px; align-items: center; margin: 4px 0; }
  #diseasePanel .cond-btn {
    padding: 2px 9px; border: 1px solid #1e3a1e; border-radius: 2px;
    cursor: pointer; color: #4a7; font-size: 0.75rem; background: transparent;
  }
  #diseasePanel .cond-btn.active { background: #0d1e0d; color: #9de; border-color: #3a7a3a; }
  #diseasePanel .slider-row { display: flex; align-items: center; gap: 5px; }
  #diseasePanel input[type=range] {
    flex: 1; accent-color: #5da; height: 14px;
  }
  #diseasePanel .val-lbl { color: #9de; min-width: 36px; text-align: right; font-size: 0.70rem; }
  #diseasePanel .release-btn {
    width: 100%; margin-top: 8px; padding: 5px 0;
    background: #0a180a; border: 1px solid #2e6a2e; color: #9de;
    border-radius: 3px; cursor: pointer; font-family: monospace;
    font-size: 0.74rem; letter-spacing: 1px;
  }
  #diseasePanel .release-btn:hover { background: #122012; }
  #diseasePanel .dp-sep {
    margin: 8px 0 5px; font-size: 0.66rem; color: #2a5a2a;
    letter-spacing: 2px; border-top: 1px solid #111e11; padding-top: 6px;
  }
  #diseasePanel .dis-item {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 3px 0; border-bottom: 1px solid #0a150a; gap: 4px;
  }
  #diseasePanel .dis-name { flex: 1; color: #6a9; font-size: 0.67rem; line-height: 1.35; }
  #diseasePanel .dis-del {
    cursor: pointer; color: #523; font-size: 0.78rem;
    padding: 0 3px; flex-shrink: 0;
  }
  #diseasePanel .dis-del:hover { color: #f55; }
  #diseasePanel .no-dis { color: #2a5a2a; font-size: 0.68rem; font-style: italic; }

  .btn-bless { color: #fdc; border-color: #5a3a10; }
  .btn-bless.active { background: rgba(255,220,160,0.18); border-color: #ffa040; }

  #blessPanel {
    position: fixed; top: 90px; left: 10px; width: 210px;
    background: #0f0c05; border: 1px solid #3a2a10; border-radius: 4px;
    padding: 9px 10px; font-family: monospace; font-size: 0.73rem;
    color: #fdc; z-index: 200; display: none; pointer-events: auto;
  }
  #blessPanel.open { display: block; }
  #blessPanel .bp-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 7px; padding-bottom: 5px; border-bottom: 1px solid #3a2a10;
  }
  #blessPanel .bp-title { color: #ffa; letter-spacing: 2px; font-size: 0.76rem; }
  #blessPanel .bp-close { cursor: pointer; color: #554; font-size: 0.82rem; line-height:1; }
  #blessPanel .bp-close:hover { color: #ccc; }
  #blessPanel label { display: block; color: #a87; font-size: 0.68rem; margin: 5px 0 2px; }
  #blessPanel select {
    width: 100%; background: #0a0805; color: #fdc; border: 1px solid #3a2a10;
    border-radius: 2px; padding: 2px 4px; font-family: monospace; font-size: 0.72rem;
  }
  #blessPanel .slider-row { display: flex; align-items: center; gap: 5px; }
  #blessPanel input[type=range] { flex: 1; accent-color: #ffa040; height: 14px; }
  #blessPanel .val-lbl { color: #ffa; min-width: 36px; text-align: right; font-size: 0.70rem; }
  #blessPanel .bestow-btn {
    width: 100%; margin-top: 8px; padding: 5px 0;
    background: #150f03; border: 1px solid #6a4a10; color: #ffa;
    border-radius: 3px; cursor: pointer; font-family: monospace;
    font-size: 0.74rem; letter-spacing: 1px;
  }
  #blessPanel .bestow-btn:hover { background: #1e1505; }
  #blessPanel .bp-sep {
    margin: 8px 0 5px; font-size: 0.66rem; color: #5a4010;
    letter-spacing: 2px; border-top: 1px solid #1e1505; padding-top: 6px;
  }
  #blessPanel .bl-item {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 3px 0; border-bottom: 1px solid #150f03; gap: 4px;
  }
  #blessPanel .bl-name { flex: 1; color: #a87; font-size: 0.67rem; line-height: 1.35; }
  #blessPanel .bl-del { cursor: pointer; color: #523; font-size: 0.78rem; padding: 0 3px; flex-shrink: 0; }
  #blessPanel .bl-del:hover { color: #f55; }
  #blessPanel .no-bl { color: #5a4010; font-size: 0.68rem; font-style: italic; }
</style>
</head>
<body>

<h1>B I O S P H E R E</h1>
<canvas id="world"></canvas>

<div id="ui">
  <button class="btn-plant"  id="selPlant">+ Plant</button>
  <button class="btn-grazer" id="selGrazer">+ Grazer</button>
  <button class="btn-hunter" id="selHunter">+ Hunter</button>
  <button class="btn-spider" id="selSpider">+ Spider</button>
  <div class="sep"></div>
  <button class="btn-speed active" id="speed1">1×</button>
  <button class="btn-speed"        id="speed2">2×</button>
  <button class="btn-speed"        id="speed4">4×</button>
  <button class="btn-speed"        id="speed8">8×</button>
  <button class="btn-speed"        id="speed16">16×</button>
  <button class="btn-speed"        id="speed32">32×</button>
  <div class="sep"></div>
  <button class="btn-pause" id="btnPause">⏸ Pause</button>
  <button class="btn-clear" id="btnClear">✕ Clear</button>
  <div class="sep"></div>
  <button class="btn-heat"  id="btnHeat">◉ Heat</button>
  <button class="btn-goal"  id="btnGoal">⚑ Goal</button>
  <div class="sep"></div>
  <button class="btn-nest"    id="selNest">⌂ Nest</button>
  <button class="btn-roost"   id="selRoost">⌂ Roost</button>
  <div class="sep"></div>
  <button class="btn-disease" id="btnDisease">☣ Disease</button>
  <button class="btn-bless" id="btnBless">✦ Bless</button>
</div>

<!-- Disease panel overlay -->
<div id="diseasePanel">
  <div class="dp-header">
    <span class="dp-title">☣ DISEASE LAB</span>
    <span class="dp-close" id="dpClose">✕</span>
  </div>

  <label>Target</label>
  <select id="dpTarget">
    <option value="-1">All Animals</option>
    <option value="0">Plants</option>
    <option value="1">Grazers</option>
    <option value="2">Hunters</option>
    <option value="3">Spiders</option>
  </select>

  <label>Gene</label>
  <select id="dpGene"></select>

  <label>Condition</label>
  <div class="cond-row">
    <button class="cond-btn active" id="dpCondGt">&gt; above</button>
    <button class="cond-btn"        id="dpCondLt">&lt; below</button>
  </div>

  <label>Threshold  <span id="dpThreshLbl" style="color:#9de"></span></label>
  <div class="slider-row">
    <input type="range" id="dpThresh" min="0" max="1" step="0.01" value="0.5">
    <span class="val-lbl" id="dpThreshVal">—</span>
  </div>

  <label>Effect</label>
  <select id="dpEffect">
    <option value="drain">Energy Drain</option>
    <option value="lethal">Lethal</option>
    <option value="infertile">Infertility</option>
    <option value="slow">Slow (movement cost)</option>
  </select>

  <label>Severity  <span id="dpSevLbl" style="color:#9de"></span></label>
  <div class="slider-row">
    <input type="range" id="dpSeverity" min="1" max="100" value="50">
    <span class="val-lbl" id="dpSevVal">50%</span>
  </div>

  <button class="release-btn" id="dpRelease">☣ Release Disease</button>

  <div class="dp-sep">ACTIVE DISEASES</div>
  <div id="dpList"><span class="no-dis">none</span></div>
</div>

<div id="blessPanel">
  <div class="bp-header">
    <span class="bp-title">✦ BLESSINGS</span>
    <span class="bp-close" id="bpClose">✕</span>
  </div>

  <label>Target Species</label>
  <select id="bpTarget">
    <optgroup label="Broad">
      <option value="all">All Animals</option>
      <option value="type:0">All Plants</option>
      <option value="type:1">All Grazers</option>
      <option value="type:2">All Hunters</option>
      <option value="type:3">All Spiders</option>
    </optgroup>
    <optgroup label="Grazer Species">
      <option value="arch:GRAZER_DEFAULT">Grazer (default)</option>
      <option value="arch:GRAZER_RABBIT">Rabbit</option>
      <option value="arch:GRAZER_DEER">Deer</option>
      <option value="arch:GRAZER_BISON">Bison</option>
      <option value="arch:GRAZER_HORSE">Horse</option>
      <option value="arch:GRAZER_TORTOISE">Tortoise</option>
      <option value="arch:GRAZER_ELEPHANT">Elephant</option>
    </optgroup>
    <optgroup label="Hunter Species">
      <option value="arch:HUNTER_DEFAULT">Hunter (default)</option>
      <option value="arch:HUNTER_CAT">Big Cat</option>
      <option value="arch:HUNTER_WOLF">Wolf</option>
      <option value="arch:HUNTER_BEAR">Bear</option>
      <option value="arch:HUNTER_SNAKE">Snake</option>
      <option value="arch:HUNTER_EAGLE">Eagle</option>
      <option value="arch:HUNTER_CROCODILE">Crocodile</option>
    </optgroup>
    <optgroup label="Spider Species">
      <option value="arch:SPIDER_DEFAULT">Spider</option>
      <option value="arch:SPIDER_ORB">Orb Weaver</option>
      <option value="arch:SPIDER_WOLF">Wolf Spider</option>
    </optgroup>
    <optgroup label="Plant Species">
      <option value="arch:PLANT_DEFAULT">Plant (default)</option>
      <option value="arch:PLANT_TREE">Tree</option>
      <option value="arch:PLANT_CACTUS">Cactus</option>
      <option value="arch:PLANT_MUSHROOM">Mushroom</option>
      <option value="arch:PLANT_VINE">Vine</option>
      <option value="arch:PLANT_FLOWER">Flower</option>
      <option value="arch:PLANT_FERN">Fern</option>
    </optgroup>
  </select>

  <label>Blessing</label>
  <select id="bpEffect">
    <option value="speed">Speed Boost</option>
    <option value="longevity">Longevity</option>
    <option value="vitality">Vitality (energy regen)</option>
    <option value="resilience">Resilience (low metabolism)</option>
    <option value="fertility">Fertility Boost</option>
  </select>

  <label>Strength</label>
  <div class="slider-row">
    <input type="range" id="bpSeverity" min="1" max="100" value="50">
    <span class="val-lbl" id="bpSevVal">50%</span>
  </div>

  <button class="bestow-btn" id="bpBestow">✦ Bestow Blessing</button>

  <div class="bp-sep">ACTIVE BLESSINGS</div>
  <div id="bpList"><span class="no-bl">none</span></div>
</div>

<div id="stats">
  <span class="s-plant"  id="st-plants">plants: –</span>
  <span class="s-grazer" id="st-grazers">grazers: –</span>
  <span class="s-hunter" id="st-hunters">hunters: –</span>
  <span class="s-spider" id="st-spiders">spiders: –</span>
  <span class="s-gen"    id="st-gen">gen: 0</span>
</div>

<script>
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');

function resize() {
  const h1H    = document.querySelector('h1').offsetHeight    || 26;
  const uiH    = document.getElementById('ui').offsetHeight   || 42;
  const statsH = document.getElementById('stats').offsetHeight || 20;
  canvas.width  = Math.min(window.innerWidth - 2, 960);
  canvas.height = Math.max(window.innerHeight - h1H - uiH - statsH - 14, 260);
  WORLD_W = canvas.width * 2;
  WORLD_H = canvas.height * 2;
  cam.x = clamp(cam.x, 0, Math.max(0, WORLD_W - canvas.width));
  cam.y = clamp(cam.y, 0, Math.max(0, WORLD_H - canvas.height));
}
window.addEventListener('resize', resize);

// World dimensions and camera (set properly in resize())
let WORLD_W = 0, WORLD_H = 0;
let cam = { x: 0, y: 0 };

// ── Types & constants ──────────────────────────────────────────────────────────
const TYPE = { PLANT: 0, GRAZER: 1, HUNTER: 2, SPIDER: 3 };

const GENE_SPEC = {
  [TYPE.PLANT]: {
    growthRate:   [0.11,   0.02,   0.30  ],
    size:         [4.0,    2.0,    9.0   ],
    spreadChance: [0.003,  0.0004, 0.010 ],
    sporeChance:  [0.0012, 0.0001, 0.0070],
    toxicity:     [0.10,   0.0,    1.0   ],
    thorns:       [0.05,   0.0,    1.0   ],
    mutationRate: [0.08,   0.01,   0.50  ],
    hue:          [120,    72,     162   ],
  },
  [TYPE.GRAZER]: {
    speed:           [1.2,  0.3,  3.0  ],
    size:            [5.0,  2.5,  11.0 ],
    senseRadius:     [60,   18,   150  ],
    metabolism:      [1.0,  0.3,  2.4  ],
    fertility:       [1.0,  0.4,  2.4  ],
    aggression:      [0.4,  0.0,  1.0  ],
    poisonResistance:[0.05, 0.0,  1.0  ],
    stamina:         [1.0,  0.3,  2.8  ],
    camouflage:      [0.0,  0.0,  0.90 ],
    mutationRate:    [0.08, 0.01, 0.50 ],
    hue:             [210,  172,  268  ],
  },
  [TYPE.HUNTER]: {
    speed:        [1.6,   0.5,   3.6  ],
    size:         [6.0,   3.5,   13.0 ],
    senseRadius:  [100,   28,    180  ],
    metabolism:   [1.0,   0.3,   2.4  ],
    fertility:    [1.0,   0.4,   2.4  ],
    aggression:   [0.7,   0.0,   1.0  ],
    stealth:      [0.0,   0.0,   0.85 ],
    nocturnal:    [0.0,   0.0,   1.0  ],
    mutationRate: [0.08,  0.01,  0.50 ],
    hue:          [15,    0,     58   ],
  },
  [TYPE.SPIDER]: {
    speed:       [0.9,  0.2, 2.2],
    size:        [5.5,  3.0, 12.0],
    senseRadius: [90,   22,  160 ],
    metabolism:  [0.75, 0.2, 1.8 ],
    fertility:   [1.0,  0.4, 2.4 ],
    webFreq:     [0.010,0.001,0.045],
    webStrength: [0.55, 0.10, 1.0 ],
    webDecay:    [0.003,0.0005,0.012],
    aggression:  [0.55, 0.0, 1.0 ],
    mutationRate:[0.08, 0.01, 0.50],
    hue:         [28,   8,   55  ],
  },
};

const EP = {
  [TYPE.PLANT]:  { start: 65,  maxBase: 120, repBase: 76,  costBase: 45 },
  [TYPE.GRAZER]: { start: 80,  maxBase: 185, repBase: 148, costBase: 65 },
  [TYPE.HUNTER]: { start: 100, maxBase: 255, repBase: 210, costBase: 90 },
  [TYPE.SPIDER]: { start: 80, maxBase: 200, repBase: 155, costBase: 68 },
};

const SIZE_DEF     = { [TYPE.PLANT]: 4, [TYPE.GRAZER]: 5, [TYPE.HUNTER]: 6, [TYPE.SPIDER]: 5.5 };
const MAX_ENTITIES = 750;
const MAX_POP      = [350, 260, 75, 55];

// ── Math ───────────────────────────────────────────────────────────────────────
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function gauss() {
  let u=0,v=0;
  while(!u) u=Math.random(); while(!v) v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function dist2(a,b){const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy;}
function dist(a,b){return Math.sqrt(dist2(a,b));}

// ── Genes ──────────────────────────────────────────────────────────────────────
function defaultGenes(type) {
  const g={};
  for(const [k,[def]] of Object.entries(GENE_SPEC[type])) g[k]=def;
  return g;
}
function mutateGenes(pg, type, rateMult=1.0) {
  const spec=GENE_SPEC[type], mr=pg.mutationRate*rateMult, child={};
  for(const [k,[,lo,hi]] of Object.entries(spec)) {
    const pv=pg[k];
    if(k==='mutationRate') child[k]=clamp(pv+gauss()*0.016,lo,hi);
    else if(k==='hue')     child[k]=clamp(pv+gauss()*mr*38,lo,hi);
    else                   child[k]=clamp(pv*(1+gauss()*mr*0.5),lo,hi);
  }
  return child;
}

function randomGenes(type) {
  let g = defaultGenes(type);
  for(let i=0;i<5;i++) g = mutateGenes(g, type, 10.0);
  return g;
}

// ── Derived stats ──────────────────────────────────────────────────────────────
function energyMax(t,g)    { return EP[t].maxBase *(g.size/SIZE_DEF[t]); }
function repThreshold(t,g) { return EP[t].repBase *(g.size/SIZE_DEF[t])/(g.fertility??1); }
function repCost(t,g)      { return EP[t].costBase*(g.size/SIZE_DEF[t]); }
function metabolicRate(g) {
  const speedCost = g.speed*g.speed*0.017;
  const sizeCost  = g.size*g.size*0.00048;        // quadratic — big bodies cost much more
  const senseCost = (g.senseRadius??0)*0.00010;   // large sense radius costs brain energy
  const fertCost  = Math.max(0,(g.fertility??1)-1)*0.0022; // reproduction above baseline
  return (speedCost + sizeCost + senseCost + fertCost + 0.004) * g.metabolism;
}

function geneColor(type,g,er) {
  if(type===TYPE.PLANT){
    const tox=g.toxicity??0, thr=g.thorns??0;
    let h=g.hue-tox*185+thr*28; if(h<0) h+=360; if(h>360) h-=360;
    return `hsl(${h.toFixed(0)},${(58+tox*22+thr*12).toFixed(0)}%,${(20+er*24).toFixed(0)}%)`;
  }
  if(type===TYPE.SPIDER)
    return `hsl(${g.hue},${(52+(g.webStrength??0.5)*28).toFixed(0)}%,${(22+er*28).toFixed(0)}%)`;
  return `hsl(${g.hue},${(58+g.aggression*30).toFixed(0)}%,${(28+er*30).toFixed(0)}%)`;
}

// ── Entities ───────────────────────────────────────────────────────────────────
let idCounter=0;
function createEntity(type,x,y,genes=null,generation=0) {
  const g=genes??defaultGenes(type);
  return { id:idCounter++, type, x, y,
    vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.4,
    genes:g, energy:EP[type].start, maxEnergy:energyMax(type,g),
    age:0, dead:false, target:null, generation, fleeing:false, poisonedTimer:0,
    burstTimer:0, burstCooldown:0, hitTimer:0,
    memX:null, memY:null, memAge:0, ancestors:[],
    sleepDrive:0, sleeping:false };
}
function spawnOffspring(parent) {
  const t=parent.type;
  // Elders (ageFrac 0.65–0.78) pass on more stable genes — reduced mutation drift
  const ageFrac=parent.age/(parent.genes.size*1800);
  const rateMult=(ageFrac>0.65&&ageFrac<0.78)?0.58:1.0;
  const g=mutateGenes(parent.genes,t,rateMult);
  const angle=Math.random()*Math.PI*2, d=parent.genes.size*3.5;
  const x=((parent.x+Math.cos(angle)*d)%WORLD_W+WORLD_W)%WORLD_W;
  const y=((parent.y+Math.sin(angle)*d)%WORLD_H+WORLD_H)%WORLD_H;
  // Plants: reject spawn if the new seedling would overlap an existing plant
  if(t===TYPE.PLANT){
    for(const n of nearby(x,y,g.size+6)){
      if(!n.dead&&n.type===TYPE.PLANT){
        const ddx=x-n.x, ddy=y-n.y;
        if(ddx*ddx+ddy*ddy<(g.size+n.genes.size)*(g.size+n.genes.size)) return null;
      }
    }
  }
  const child=createEntity(t,x,y,g,parent.generation+1);
  child.maxEnergy=energyMax(t,g); child.energy=EP[t].start*0.6;
  // Carry ancestry chain forward (last 5 snapshots)
  child.ancestors=[...(parent.ancestors||[]).slice(-4),
    {gen:parent.generation, genes:Object.assign({},parent.genes)}];
  return child;
}
function spawnRandom(type) {
  const bank = geneBank[type];
  let genes = null, gen = maxGenByType[type];
  if(bank.length > 0){
    const src = bank[Math.floor(Math.random()*bank.length)];
    genes = mutateGenes(src.genes, type);
    gen   = Math.max(gen, src.generation);
  }
  return createEntity(type,
    Math.random()*(WORLD_W-20)+10,
    Math.random()*(WORLD_H-20)+10,
    genes, gen);
}

let entities=[];
let webs = [];
const MAX_WEBS = 120;
function seed() {
  for(let i=0;i<110;i++) entities.push(spawnRandom(TYPE.PLANT));
  for(let i=0;i< 22;i++) entities.push(spawnRandom(TYPE.GRAZER));
  for(let i=0;i<  4;i++) entities.push(spawnRandom(TYPE.HUNTER));
}

// ── Grid ───────────────────────────────────────────────────────────────────────
const CELL=80;
const _GCOLS=2000; // row stride for integer grid keys (must exceed max WORLD_H/CELL)
let grid=new Map();
let nutGrid=new Map();
let popCount=[0,0,0,0];

function buildGrid() {
  grid.clear(); nutGrid.clear();
  popCount[0]=popCount[1]=popCount[2]=popCount[3]=0;
  for(const e of entities) {
    if(e.dead) continue;
    popCount[e.type]++;
    const k=Math.floor(e.x/CELL)*_GCOLS+Math.floor(e.y/CELL);
    let cell=grid.get(k);
    if(!cell){ cell=[]; grid.set(k,cell); }
    cell.push(e);
  }
  for(const n of nutrients) {
    const k=Math.floor(n.x/CELL)*_GCOLS+Math.floor(n.y/CELL);
    let cell=nutGrid.get(k);
    if(!cell){ cell=[]; nutGrid.set(k,cell); }
    cell.push(n);
  }
}
const _nearbyBuf=[];
function nearby(x,y,r) {
  _nearbyBuf.length=0;
  const cx=Math.floor(x/CELL), cy=Math.floor(y/CELL), cr=Math.ceil(r/CELL)+1;
  for(let dx=-cr;dx<=cr;dx++)
    for(let dy=-cr;dy<=cr;dy++){
      const b=grid.get((cx+dx)*_GCOLS+(cy+dy));
      if(b) for(const e of b) _nearbyBuf.push(e);
    }
  return _nearbyBuf;
}

// ── Nutrients ──────────────────────────────────────────────────────────────────
const MAX_NUTRIENTS=80;
let nutrients=[];
function addNutrient(x,y,amount) {
  if(nutrients.length<MAX_NUTRIENTS) nutrients.push({x,y,amount});
}

// ── Fertility zones (static terrain) ─────────────────────────────────────────
let fertZones = []; // {x,y,r,str}
let fertGrads = []; // cached CanvasGradient objects (built once per genFertZones call)
function genFertZones() {
  fertZones = [];
  for(let i=0;i<9;i++){
    fertZones.push({
      x: 80 + Math.random()*(WORLD_W-160),
      y: 60 + Math.random()*(WORLD_H-120),
      r: 80 + Math.random()*100,
      str: 0.55 + Math.random()*0.45
    });
  }
  // Build gradient objects once — reused every frame instead of creating 9 per frame
  fertGrads = fertZones.map(z => {
    const grd = ctx.createRadialGradient(z.x,z.y,0,z.x,z.y,z.r);
    grd.addColorStop(0,`rgba(36,90,36,${(z.str*0.055).toFixed(3)})`);
    grd.addColorStop(1,'rgba(36,90,36,0)');
    return grd;
  });
}

// ── Day / night cycle ─────────────────────────────────────────────────────────
const DAY_LENGTH = 1400; // ticks per full day
function nightIntensity() {
  const p = (tick % DAY_LENGTH) / DAY_LENGTH;
  return (1 - Math.cos(p * Math.PI * 2)) * 0.5; // 0=dawn/dusk, 1=midnight
}

// ── Structures (nests & roosts) ───────────────────────────────────────────────
const STRUCT = { NEST: 0, ROOST: 1 };
const STRUCT_R = 34;
let structures = []; // {type, x, y}

// ── Corpses (decomposers) ─────────────────────────────────────────────────────
const CORPSE_LIFE = 420;
let corpses = []; // {x,y,energy,age}

// ── Gene bank (persists evolved traits through extinction) ────────────────────
const GENE_BANK_SIZE = 30;
let geneBank = [[], [], [], []];

function archiveGenes(e) {
  const bank = geneBank[e.type];
  bank.push({ genes: Object.assign({}, e.genes), generation: e.generation });
  if(bank.length > GENE_BANK_SIZE) bank.shift();
}

// ── Spores ────────────────────────────────────────────────────────────────────
const MAX_SPORES=100;
let spores=[];

function isImmature(e) { return e.type===TYPE.PLANT && e.age < e.genes.size*80; }

function releaseSpore(plant) {
  if(spores.length>=MAX_SPORES) return;
  const angle=Math.random()*Math.PI*2, speed=2.2+Math.random()*4.2;
  spores.push({
    x:plant.x, y:plant.y,
    vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
    genes:Object.assign({},plant.genes),
    generation:plant.generation+1, age:0,
    lifetime:300+Math.random()*200|0
  });
}

function stepSpores() {
  spores=spores.filter(s=>{
    s.vx+=(Math.random()-0.5)*0.08; s.vy+=(Math.random()-0.5)*0.08; // organic drift
    s.vx*=0.992; s.vy*=0.992;
    s.x+=s.vx; s.y+=s.vy;
    if(s.x<0) s.x+=WORLD_W; else if(s.x>=WORLD_W) s.x-=WORLD_W;
    if(s.y<0) s.y+=WORLD_H; else if(s.y>=WORLD_H) s.y-=WORLD_H;
    s.age++;
    if(s.age>=s.lifetime){
      if(popCount[TYPE.PLANT]<MAX_POP[TYPE.PLANT]&&entities.length+newborns.length<MAX_ENTITIES){
        const g=mutateGenes(s.genes,TYPE.PLANT);
        // Only germinate if the landing spot isn't already occupied by a plant
        let _clear=true;
        for(const n of nearby(s.x,s.y,g.size+6)){
          if(!n.dead&&n.type===TYPE.PLANT){
            const _dx=s.x-n.x, _dy=s.y-n.y;
            if(_dx*_dx+_dy*_dy<(g.size+n.genes.size)*(g.size+n.genes.size)){_clear=false;break;}
          }
        }
        if(_clear){
          const child=createEntity(TYPE.PLANT,s.x,s.y,g,s.generation);
          child.energy=EP[TYPE.PLANT].start*0.58; child.maxEnergy=energyMax(TYPE.PLANT,g);
          newborns.push(child);
        }
      }
      return false;
    }
    return true;
  });
}

// ── Territorial scents ────────────────────────────────────────────────────────
const MAX_SCENTS = 140, SCENT_LIFE = 480, SCENT_R = 68, SCENT_R2 = 68*68;
let scents = []; // {x,y,age,ownerId}

// ── Challenge mode ────────────────────────────────────────────────────────────
let challenge = null; // {type,target,startTick,sustainStart,achieved,label}
const CHALLENGES = [
  null,
  { type:'gen',     target:500,  label:'reach gen 500'          },
  { type:'gen',     target:1000, label:'reach gen 1000'         },
  { type:'sustain', target:5000, label:'sustain 3 species 5k ticks' },
  { type:'sustain', target:15000,label:'sustain 3 species 15k ticks'},
];
let challengeIdx = 0;

// ── Atmosphere ────────────────────────────────────────────────────────────────
// o2/co2 are independent [0.05–0.95]; ~0.50 = baseline equilibrium
const atmos = { o2: 0.50, co2: 0.50 };
let _atmosLowO2  = false; // edge-trigger flags for event log
let _atmosLowCO2 = false;

function stepAtmos() {
  const P = popCount[TYPE.PLANT];
  const A = popCount[TYPE.GRAZER] + popCount[TYPE.HUNTER] + (popCount[TYPE.SPIDER]||0);
  const net = (P - A * 1.1) * 0.000028; // positive = plants winning → more O2
  atmos.o2  = clamp(atmos.o2  + net + (0.50 - atmos.o2)  * 0.0030, 0.05, 0.95);
  atmos.co2 = clamp(atmos.co2 - net + (0.50 - atmos.co2) * 0.0030, 0.05, 0.95);
  // Log atmosphere alerts
  if(atmos.o2  < 0.28 && !_atmosLowO2)  { _atmosLowO2=true;  logEvt('O₂ critically low — animals struggling','#48f'); }
  if(atmos.o2  > 0.40 &&  _atmosLowO2)  { _atmosLowO2=false; logEvt('O₂ recovering','#4af'); }
  if(atmos.co2 < 0.28 && !_atmosLowCO2) { _atmosLowCO2=true; logEvt('CO₂ depleted — plants struggling','#4c4'); }
  if(atmos.co2 > 0.40 &&  _atmosLowCO2) { _atmosLowCO2=false; }
}

// ── Simulation ─────────────────────────────────────────────────────────────────
let newborns=[];

function stepPlant(e) {
  let _bpVitality=0, _bpResil=0, _bpFertMult=1, _bpLifeMult=1;
  e._blessed=false;
  for(const bl of blessings){
    if(!blessingMatches(bl,e)) continue;
    e._blessed=true;
    if(bl.effect==='vitality')   _bpVitality +=bl.severity*0.015;
    if(bl.effect==='resilience') _bpResil    +=bl.severity*0.5;
    if(bl.effect==='longevity')  _bpLifeMult +=bl.severity*0.8;
    if(bl.effect==='fertility')  _bpFertMult *=(1+bl.severity*0.7);
  }

  let bonus=0;
  // Nutrient lookup via spatial grid (radius 38 < CELL, so 3×3 cell neighborhood suffices)
  const _ncx=Math.floor(e.x/CELL), _ncy=Math.floor(e.y/CELL);
  for(let _ndx=-1;_ndx<=1;_ndx++) for(let _ndy=-1;_ndy<=1;_ndy++){
    const _nb=nutGrid.get((_ncx+_ndx)*_GCOLS+(_ncy+_ndy));
    if(_nb) for(const n of _nb){
      const dx=e.x-n.x,dy=e.y-n.y,d2=dx*dx+dy*dy;
      if(d2<1444) bonus+=n.amount*(1-Math.sqrt(d2)/38)*0.5;
    }
  }
  for(const z of fertZones){
    const dx=e.x-z.x, dy=e.y-z.y, d2=dx*dx+dy*dy;
    if(d2<z.r*z.r) bonus+=z.str*(1-Math.sqrt(d2)/z.r)*0.8;
  }
  const co2mult = 0.55 + atmos.co2 * 0.90; // 0.55 at min CO2, 1.0 at 0.5, 1.45 at max
  e.energy=Math.min(e.maxEnergy, e.energy+e.genes.growthRate*(1+bonus)*co2mult);
  if(_bpVitality>0) e.energy=Math.min(e.maxEnergy,e.energy+_bpVitality);
  e.energy-=(e.genes.size*0.0010+e.genes.spreadChance*2.5)*(1-_bpResil*0.35); // size & spread upkeep cost
  const crowd0=Math.max(0,popCount[TYPE.PLANT]/MAX_POP[TYPE.PLANT]-0.68);
  e.energy-=crowd0*crowd0*2.2; // density disease — quadratic drain above 68% cap

  // Plant diseases
  let _disPlantInfertile=false;
  e._diseased=false;
  for(const dis of diseases){
    if(dis.targetType!==0) continue; // plants only
    const val=e.genes[dis.gene];
    if(val===undefined) continue;
    if(dis.cond==='>'?val<=dis.threshold:val>=dis.threshold) continue;
    e._diseased=true;
    if(dis.effect==='drain')    e.energy-=0.010*dis.severity;
    else if(dis.effect==='lethal') e.energy-=0.06*dis.severity;
    else if(dis.effect==='infertile') _disPlantInfertile=true;
  }

  if(e.energy<=0){ e.dead=true; return; }
  if(e.age>(4000+e.genes.size*800)*_bpLifeMult){ addNutrient(e.x,e.y,e.genes.size*2.5); e.dead=true; return; }
  const rt=repThreshold(TYPE.PLANT,e.genes), rc=repCost(TYPE.PLANT,e.genes);
  if(!_disPlantInfertile && entities.length+newborns.length<MAX_ENTITIES
    && e.energy>rt && Math.random()<e.genes.spreadChance*_bpFertMult) {
    const _child=spawnOffspring(e);
    if(_child){ e.energy-=rc; newborns.push(_child); }
  }
  if(!_disPlantInfertile && spores.length<MAX_SPORES && e.energy>rt*0.55 && Math.random()<e.genes.sporeChance){
    releaseSpore(e); e.energy-=rc*0.28;
  }
}

function stepAnimal(e) {
  // Compute blessing multipliers
  let _blSpeedMult=1, _blLifeMult=1, _blVitality=0, _blResil=0, _blFertBoost=1;
  e._blessed=false;
  for(const bl of blessings){
    if(!blessingMatches(bl,e)) continue;
    e._blessed=true;
    if(bl.effect==='speed')      _blSpeedMult+=bl.severity*0.8;
    if(bl.effect==='longevity')  _blLifeMult +=bl.severity*0.9;
    if(bl.effect==='vitality')   _blVitality +=bl.severity*0.022;
    if(bl.effect==='resilience') _blResil    +=bl.severity*0.40;
    if(bl.effect==='fertility')  _blFertBoost+=bl.severity*0.7;
  }

  const g=e.genes, t=e.type;
  const lifespan=g.size*1800*_blLifeMult, ageFrac=e.age/lifespan;
  if(ageFrac>=1){ addNutrient(e.x,e.y,g.size*2); e.dead=true; return; }
  const speedMult=ageFrac>0.7?Math.max(0.2,1-(ageFrac-0.7)*2.2):1;
  const juvenileBoost=ageFrac<0.15?1.35:1.0;
  let effSpeed=g.speed*speedMult*juvenileBoost;
  effSpeed*=_blSpeedMult;
  const canReproduce=ageFrac>=0.15&&ageFrac<0.78;
  // spiders eat any animal; grazers flee both hunters and spiders
  const eatType = t===TYPE.GRAZER ? TYPE.PLANT : (t===TYPE.SPIDER ? -1 : TYPE.GRAZER);
  const predType = t===TYPE.GRAZER ? [TYPE.HUNTER, TYPE.SPIDER] : null;

  // Nocturnal hunters get a speed boost at night
  const ni=nightIntensity();
  if(t===TYPE.HUNTER) effSpeed*=(1+(g.nocturnal??0)*ni*0.70);

  if(e.burstTimer>0) e.burstTimer--;
  if(e.burstCooldown>0) e.burstCooldown--;
  if(e.hitTimer>0) e.hitTimer--;
  if(e.memX!==null){ e.memAge++; if(e.memAge>500){e.memX=null;e.memY=null;} }
  if(t===TYPE.HUNTER && e.age%20===0){
    if(scents.length>=MAX_SCENTS) scents.shift();
    scents.push({x:e.x,y:e.y,age:0,ownerId:e.id});
  }

  e.fleeing=false;
  if(predType!==null && g.aggression<0.72){
    const fleeR=g.senseRadius*(1.15-g.aggression*0.45);
    const camo=g.camouflage??0;
    const threats=nearby(e.x,e.y,fleeR).filter(n=>
      !n.dead&&predType.includes(n.type)&&dist(e,n)<n.genes.senseRadius*(1-camo*0.62)*(1-(n.genes.stealth??0)*0.60));
    if(threats.length){
      const threat=threats.reduce((b,n)=>dist2(e,n)<dist2(e,b)?n:b);
      const d=dist(e,threat)||1;
      if(e.burstCooldown===0 && d<fleeR*0.45){
        e.burstTimer=(18+(g.stamina??1)*8)|0;
        e.burstCooldown=120;
      }
      if(e.burstTimer>0){ effSpeed*=1+(g.stamina??1)*0.65; e.energy-=(g.stamina??1)*0.08; }
      e.vx=(e.x-threat.x)/d*effSpeed; e.vy=(e.y-threat.y)/d*effSpeed;
      e.fleeing=true; e.target=null;
    }
  }

  // ── Circadian sleep drive ─────────────────────────────────────────────────────
  if(t===TYPE.GRAZER){
    e.sleepDrive=clamp((e.sleepDrive??0)+ni*0.0014-0.00028,0,1);
  } else if(t===TYPE.HUNTER){
    const noc=g.nocturnal??0;
    e.sleepDrive=clamp((e.sleepDrive??0)+noc*(1-ni)*0.0012-0.00028,0,1);
  }

  let sleepingThisFrame=false;

  // Wake check — dawn wakes grazers, dusk wakes nocturnal hunters, threat always wakes
  if(e.sleeping){
    const dawnWake=t===TYPE.GRAZER?(ni<0.18):(g.nocturnal??0)>0.3&&ni>0.45;
    if((e.sleepDrive??0)<0.04||dawnWake||e.fleeing){
      e.sleeping=false;
    } else {
      e.vx*=0.65; e.vy*=0.65; // slow drift to halt
      sleepingThisFrame=true;
    }
  }

  // If tired enough and calm, seek home structure or sleep in place
  if(!e.fleeing&&!e.sleeping&&!sleepingThisFrame&&(e.sleepDrive??0)>0.70){
    const sType=t===TYPE.GRAZER?STRUCT.NEST:STRUCT.ROOST;
    let home=null, bestD=Infinity;
    for(const s of structures){ if(s.type!==sType) continue; const d2=dist2(e,s); if(d2<bestD){bestD=d2;home=s;} }
    if(home){
      if(bestD<(STRUCT_R*0.58)**2){
        e.sleeping=true; e.vx*=0.4; e.vy*=0.4; sleepingThisFrame=true;
      } else {
        const d=Math.sqrt(bestD);
        e.vx=(home.x-e.x)/d*effSpeed*0.62; e.vy=(home.y-e.y)/d*effSpeed*0.62;
      }
    } else if((e.sleepDrive??0)>0.92){
      e.sleeping=true; sleepingThisFrame=true;
    }
  }

  if(!e.fleeing&&!sleepingThisFrame){
    const lost=!e.target||e.target.dead||dist2(e,e.target)>(g.senseRadius*1.6)**2;
    if(lost){
      e.target=null;
      const cands=nearby(e.x,e.y,g.senseRadius).filter(n=>
        !n.dead&&(eatType===-1?(n.type===TYPE.GRAZER||n.type===TYPE.HUNTER):n.type===eatType));
      if(cands.length){
        if(t===TYPE.HUNTER){
          // Prefer isolated grazers; pack hunting: converge on already-targeted prey
          let best=cands[0], bestScore=Infinity;
          for(const n of cands){
            const herdR=(n.genes.senseRadius*0.55)**2;
            const herd=cands.filter(m=>m!==n&&dist2(n,m)<herdR).length;
            let score=dist2(e,n)*(1+herd*0.72);
            const packed=entities.some(h=>!h.dead&&h.type===TYPE.HUNTER&&h!==e&&h.target===n);
            if(packed) score*=0.55;
            if(score<bestScore){ bestScore=score; best=n; }
          }
          e.target=best;
        } else {
          e.target=cands.reduce((b,n)=>dist2(e,n)<dist2(e,b)?n:b);
        }
      }
    }
    if(e.target&&!e.target.dead){
      const d=dist(e,e.target)||1;
      const chaseR=g.senseRadius*(0.4+g.aggression*0.75);
      if(d<chaseR){ e.vx=(e.target.x-e.x)/d*effSpeed; e.vy=(e.target.y-e.y)/d*effSpeed; }
      else         { e.target=null; }
      if(e.target && d<g.size+e.target.genes.size+1.5){
        if(eatType===TYPE.PLANT){
          const ripeness=Math.min(1, e.target.age/(e.target.genes.size*80));
          const bite=Math.min(e.target.energy*0.38,26)*Math.max(0.18,ripeness);
          if(bite>1){
            e.energy=Math.min(e.maxEnergy,e.energy+bite*(0.62+g.aggression*0.10));
            e.target.energy-=bite;
            if(e.target.energy<5){ addNutrient(e.target.x,e.target.y,e.target.energy); e.target.dead=true; }
            const tox=e.target?.genes.toxicity??0;
            const poisonDmg=bite*tox*(1-(g.poisonResistance??0))*0.95;
            if(poisonDmg>0.5){
              e.energy-=poisonDmg;
              e.poisonedTimer=Math.max(e.poisonedTimer??0, 90+poisonDmg*6|0);
              if(e.energy<=0){ addNutrient(e.x,e.y,g.size*2); e.dead=true; }
            }
            const thornDmg=bite*(e.target?.genes.thorns??0)*0.35;
            if(thornDmg>0.3){ e.energy-=thornDmg; if(e.energy<=0){ addNutrient(e.x,e.y,g.size*2); e.dead=true; } }
            e.memX=e.x; e.memY=e.y; e.memAge=0;
            e.target=null;
          }
        } else {
          const kickDmg=e.target.genes.size*(e.target.genes.aggression??0)*0.44;
          e.energy-=kickDmg;
          if(kickDmg>1.5) e.hitTimer=25;
          if(e.energy<=0){ logEvt('hunter kicked to death!','#f84'); corpses.push({x:e.x,y:e.y,energy:g.size*3,age:0}); e.dead=true; e.target=null; return; }
          e.energy=Math.min(e.maxEnergy,e.energy+e.target.energy*(0.55+g.aggression*0.12));
          corpses.push({x:e.target.x, y:e.target.y, energy:e.target.energy*0.5, age:0});
          e.memX=e.target.x; e.memY=e.target.y; e.memAge=0;
          e.target.dead=true; e.target=null;
        }
      }
    } else {
      if(e.memX!==null){
        const md=Math.hypot(e.memX-e.x,e.memY-e.y);
        if(md>10){ e.vx=(e.memX-e.x)/md*effSpeed*0.78; e.vy=(e.memY-e.y)/md*effSpeed*0.78; }
        else { e.memX=null; e.memY=null; }
      } else {
        // Spider: move toward web with slowed prey nearby
        if(t===TYPE.SPIDER){
          let bestWeb=null, bestD=Infinity;
          for(const w of webs){
            if(w.spiderId!==e.id) continue;
            const wd=Math.hypot(w.x-e.x, w.y-e.y);
            // Check for prey in this web
            const hasPrey=nearby(w.x,w.y,w.radius).some(n=>
              !n.dead&&(n.type===TYPE.GRAZER||n.type===TYPE.HUNTER)&&
              Math.sqrt((n.vx*n.vx+n.vy*n.vy))<effSpeed*0.4);
            if(hasPrey && wd<bestD){ bestD=wd; bestWeb=w; }
          }
          if(bestWeb){ e.vx=(bestWeb.x-e.x)/bestD*effSpeed; e.vy=(bestWeb.y-e.y)/bestD*effSpeed; }
          else { e.vx+=(Math.random()-0.5)*0.33; e.vy+=(Math.random()-0.5)*0.33; }
        } else {
          e.vx+=(Math.random()-0.5)*0.33; e.vy+=(Math.random()-0.5)*0.33;
        }
      }
      if(t===TYPE.HUNTER){
        for(const s of scents){
          if(s.ownerId===e.id) continue;
          const dx=e.x-s.x, dy=e.y-s.y, d2=dx*dx+dy*dy;
          if(d2<SCENT_R2&&d2>0){
            const d=Math.sqrt(d2), str=(1-d/SCENT_R)*(1-s.age/SCENT_LIFE)*0.48;
            e.vx+=dx/d*str; e.vy+=dy/d*str;
          }
        }
      }
      const spd=Math.sqrt(e.vx*e.vx+e.vy*e.vy);
      if(spd>effSpeed*0.85){const s=effSpeed*0.85/spd;e.vx*=s;e.vy*=s;}
    }
  }

  // Separation: push away from any entity that overlaps (skip current prey/target)
  for(const n of nearby(e.x,e.y,g.size+14)){
    if(n===e||n===e.target||n.dead) continue;
    const sdx=e.x-n.x, sdy=e.y-n.y, sd2=sdx*sdx+sdy*sdy;
    const minD=g.size+n.genes.size;
    if(sd2<minD*minD){
      if(sd2<0.01){ e.vx+=(Math.random()-0.5)*0.5; e.vy+=(Math.random()-0.5)*0.5; }
      else{ const sd=Math.sqrt(sd2), str=(minD-sd)*(sleepingThisFrame?0.10:0.35);
            e.vx+=sdx/sd*str; e.vy+=sdy/sd*str; }
    }
  }
  e.x+=e.vx; e.y+=e.vy;
  if(e.x<0) e.x+=WORLD_W; else if(e.x>=WORLD_W) e.x-=WORLD_W;
  if(e.y<0) e.y+=WORLD_H; else if(e.y>=WORLD_H) e.y-=WORLD_H;

  // Web slowdown
  if(t!==TYPE.SPIDER){
    for(const w of webs){
      const wdx=e.x-w.x, wdy=e.y-w.y;
      if(wdx*wdx+wdy*wdy<w.radius*w.radius){
        const drag=1-w.strength*0.82;
        e.vx*=drag; e.vy*=drag;
        break;
      }
    }
  }

  if(e.poisonedTimer>0) e.poisonedTimer--;
  const metabMult=sleepingThisFrame?0.28:1.0;
  e.energy-=metabolicRate(g)*metabMult;
  if(_blVitality>0)  e.energy=Math.min(e.maxEnergy,e.energy+_blVitality);
  if(_blResil>0)     e.energy=Math.min(e.maxEnergy,e.energy+metabolicRate(g)*_blResil);
  if(sleepingThisFrame) e.energy=Math.min(e.maxEnergy,e.energy+0.10); // sleep regen
  e.sleepDrive=Math.max(0,(e.sleepDrive??0)-(sleepingThisFrame?0.0030:0));
  e.energy+=(atmos.o2-0.50)*0.10;
  if(atmos.o2<0.30) e.energy-=(0.30-atmos.o2)*0.55;
  const crowd=Math.max(0,popCount[t]/MAX_POP[t]-0.68);
  e.energy-=crowd*crowd*1.8;

  // Disease effects
  let _disInfertile=false;
  e._diseased=false;
  for(const dis of diseases){
    if(dis.targetType!==t && dis.targetType!==-1) continue;
    const val=g[dis.gene];
    if(val===undefined) continue;
    if(dis.cond==='>'?val<=dis.threshold:val>=dis.threshold) continue;
    e._diseased=true;
    if(dis.effect==='drain')    e.energy-=0.016*dis.severity;
    else if(dis.effect==='lethal') e.energy-=0.09*dis.severity;
    else if(dis.effect==='slow'){
      const mv=Math.sqrt(e.vx*e.vx+e.vy*e.vy);
      e.energy-=mv*0.018*dis.severity;
    } else if(dis.effect==='infertile') _disInfertile=true;
  }

  if(e.energy<=0){ addNutrient(e.x,e.y,g.size*2.5); e.dead=true; return; }

  const rt=repThreshold(t,g), rc=repCost(t,g);
  if(canReproduce && !_disInfertile && entities.length+newborns.length<MAX_ENTITIES && e.energy>rt/_blFertBoost){
    e.energy-=rc; newborns.push(spawnOffspring(e));
  }

  // Spider web laying
  if(t===TYPE.SPIDER && webs.length<120 && Math.random()<(g.webFreq??0.01)){
    webs.push({ x:e.x, y:e.y, strength:(g.webStrength??0.55), maxStr:(g.webStrength??0.55),
                radius:g.size*5.5, spiderId:e.id, age:0 });
  }
}

function checkExtinction() {
  if(popCount[0]<5)   { logEvt('plants near extinction!','#4a4'); for(let i=0;i<12;i++) entities.push(spawnRandom(TYPE.PLANT)); }
  if(popCount[1]===0) { logEvt('grazers extinct — respawning','#4af'); for(let i=0;i< 5;i++) entities.push(spawnRandom(TYPE.GRAZER)); }
  if(popCount[2]===0) { logEvt('hunters extinct — respawning','#f52'); entities.push(spawnRandom(TYPE.HUNTER)); }
}

function step() {
  tick++;
  buildGrid(); newborns=[];
  for(const e of entities){ if(e.dead) continue; e.age++; (e.type===TYPE.PLANT?stepPlant:stepAnimal)(e); }
  nutrients=nutrients.filter(n=>{n.amount*=0.997;return n.amount>0.7;});
  entities=entities.filter(e=>{ if(e.dead) archiveGenes(e); return !e.dead; });
  // Corpse decomposition — delayed nutrient burst at kill sites
  for(let i=corpses.length-1;i>=0;i--){
    corpses[i].age++;
    if(corpses[i].age>=CORPSE_LIFE){ addNutrient(corpses[i].x,corpses[i].y,corpses[i].energy); corpses.splice(i,1); }
  }
  stepSpores();
  // Web decay
  for(let i=webs.length-1;i>=0;i--){
    webs[i].age++;
    webs[i].strength -= webs[i].strength * (webs[i].maxStr * 0.00018 + 0.0005);
    if(webs[i].strength<0.04) webs.splice(i,1);
  }
  for(const e of newborns){
    if(e.generation>maxGeneration) maxGeneration=e.generation;
    if(e.generation>maxGenByType[e.type]) maxGenByType[e.type]=e.generation;
  }
  entities.push(...newborns);
  checkExtinction();
  checkMilestones();
  stepAtmos();
  // Scent decay
  for(let i=scents.length-1;i>=0;i--){ scents[i].age++; if(scents[i].age>=SCENT_LIFE) scents.splice(i,1); }
  // Challenge tracking
  if(challenge&&!challenge.achieved){
    if(challenge.type==='gen'){
      if(maxGeneration>=challenge.target){ challenge.achieved=true; logEvt(`⚑ reached gen ${challenge.target}!`,'#ffd040'); }
    } else if(challenge.type==='sustain'){
      if(popCount[0]>0&&popCount[1]>0&&popCount[2]>0){
        if(challenge.sustainStart===null) challenge.sustainStart=tick;
        if(tick-challenge.sustainStart>=challenge.target){ challenge.achieved=true; logEvt('⚑ ecosystem sustained — challenge complete!','#ffd040'); }
      } else { challenge.sustainStart=null; }
    }
  }
}

let tick = 0;

const milestoneHit = {};

const LOG_MAX = 8;

const GENE_MILESTONES = [
  { type:TYPE.PLANT,  gene:'toxicity',        marks:[0.35,0.65,0.88], label:'plant toxin',    color:'#c06fe0' },
  { type:TYPE.PLANT,  gene:'thorns',          marks:[0.30,0.60,0.85], label:'plant thorns',   color:'#d4c040' },
  { type:TYPE.GRAZER, gene:'camouflage',       marks:[0.30,0.60,0.82], label:'grazer camo',    color:'#80c8a0' },
  { type:TYPE.GRAZER, gene:'poisonResistance', marks:[0.45,0.78],      label:'grazer resist',  color:'#b06aff' },
  { type:TYPE.GRAZER, gene:'stamina',          marks:[1.7, 2.3],       label:'grazer stamina', color:'#ffd040' },
  { type:TYPE.HUNTER, gene:'speed',            marks:[2.4, 3.1],       label:'hunter speed',   color:'#f84'    },
  { type:TYPE.HUNTER, gene:'aggression',       marks:[0.88],           label:'hunter aggr',    color:'#f44'    },
  { type:TYPE.HUNTER, gene:'stealth',          marks:[0.30,0.60],      label:'hunter stealth',   color:'#88c4f8' },
  { type:TYPE.HUNTER, gene:'nocturnal',        marks:[0.40,0.75],      label:'hunter nocturnal', color:'#9060d8' },
];

function logEvt(msg, color='#8a8') {
  eventLog.push({ msg, color, tick });
  if(eventLog.length > LOG_MAX) eventLog.shift();
}

function checkMilestones() {
  if(tick%300!==0) return;
  const genMark=Math.floor(maxGeneration/100)*100;
  if(genMark>0 && genMark>lastLoggedGen){ logEvt(`gen ${genMark} reached`,'#555'); lastLoggedGen=genMark; }
  for(const m of GENE_MILESTONES){
    const pool=entities.filter(e=>!e.dead&&e.type===m.type);
    if(!pool.length) continue;
    const maxVal=pool.reduce((b,e)=>Math.max(b,e.genes[m.gene]??0),0);
    for(const mark of m.marks){
      const key=`${m.type}_${m.gene}_${mark}`;
      if(maxVal>=mark&&!milestoneHit[key]){ milestoneHit[key]=true; logEvt(`${m.label} → ${maxVal.toFixed(2)}`,m.color); }
    }
  }
}

function heatColor(val, lo, hi) {
  const t=clamp((val-lo)/(hi-lo),0,1);
  return [Math.round(240-t*240), 90, Math.round(42+t*14)]; // [h,s,l]
}

}

const ARCHETYPE_NAMES = {
  PLANT_DEFAULT:'plant', PLANT_TREE:'tree', PLANT_CACTUS:'cactus', PLANT_MUSHROOM:'mushroom',
  PLANT_VINE:'vine', PLANT_FLOWER:'flower', PLANT_FERN:'fern',
  GRAZER_DEFAULT:'grazer', GRAZER_RABBIT:'rabbit', GRAZER_DEER:'deer', GRAZER_BISON:'bison',
  GRAZER_HORSE:'horse', GRAZER_TORTOISE:'tortoise', GRAZER_ELEPHANT:'elephant',
  HUNTER_DEFAULT:'hunter', HUNTER_CAT:'big cat', HUNTER_WOLF:'wolf', HUNTER_BEAR:'bear',
  HUNTER_SNAKE:'snake', HUNTER_EAGLE:'eagle', HUNTER_CROCODILE:'crocodile',
  SPIDER_DEFAULT:'spider', SPIDER_ORB:'orb weaver', SPIDER_WOLF:'wolf spider',
};

function getArchetype(type, genes) {
  const g=genes;
  if(type===TYPE.PLANT){
    if(g.size>7.0&&(g.thorns??0)<0.30&&(g.toxicity??0)<0.30) return 'PLANT_TREE';
    if((g.thorns??0)>0.45)                                    return 'PLANT_CACTUS';
    if((g.toxicity??0)>0.45)                                  return 'PLANT_MUSHROOM';
    if((g.spreadChance??0)>0.006)                             return 'PLANT_VINE';
    if((g.sporeChance??0)>0.003)                              return 'PLANT_FLOWER';
    if(g.growthRate>0.18&&g.size<5.0)                        return 'PLANT_FERN';
    return 'PLANT_DEFAULT';
  }
  if(type===TYPE.GRAZER){
    if(g.size>9.5&&(g.aggression??0)>0.45)                   return 'GRAZER_ELEPHANT';
    if(g.size>8.0&&(g.stamina??1)>1.7)                       return 'GRAZER_BISON';
    if(g.speed>2.2&&g.size<7.5)                              return 'GRAZER_HORSE';
    if(g.senseRadius>105||(g.camouflage??0)>0.45)            return 'GRAZER_DEER';
    if(g.speed>1.9&&(g.fertility??1)>1.4)                    return 'GRAZER_RABBIT';
    if((g.poisonResistance??0)>0.50)                          return 'GRAZER_TORTOISE';
    return 'GRAZER_DEFAULT';
  }
  if(type===TYPE.SPIDER){
    if(g.size>8.0||(g.webStrength??0)>0.70)   return 'SPIDER_ORB';
    if(g.speed>1.5&&(g.webFreq??0)<0.005)      return 'SPIDER_WOLF';
    return 'SPIDER_DEFAULT';
  }
  // TYPE.HUNTER
  if(g.size>9.5)                                             return 'HUNTER_BEAR';
  if(g.size>8.0&&(g.aggression??0)>0.65)                    return 'HUNTER_CROCODILE';
  if(g.speed>2.4)                                            return 'HUNTER_CAT';
  if(g.senseRadius>145)                                      return 'HUNTER_EAGLE';
  if((g.aggression??0)>0.80)                                 return 'HUNTER_WOLF';
  if((g.stealth??0)>0.55)                                    return 'HUNTER_SNAKE';
  return 'HUNTER_DEFAULT';
}

// ── Structures render ──────────────────────────────────────────────────────────
function drawStructures() {
  const ni=nightIntensity();
  for(const s of structures){
    const isNest=s.type===STRUCT.NEST;
    const col=isNest?'#c8903a':'#9070d0';
    const activeTime=isNest?(1-ni):ni; // nests glow at day, roosts glow at night
    // Radius glow — gradient cached on structure object, created once
    if(!s._grad){
      s._grad=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,STRUCT_R);
      s._grad.addColorStop(0,isNest?'rgba(200,144,58,1)':'rgba(144,112,208,1)');
      s._grad.addColorStop(1,'rgba(0,0,0,0)');
    }
    ctx.globalAlpha=0.05+activeTime*0.10;
    ctx.fillStyle=s._grad;
    ctx.beginPath(); ctx.arc(s.x,s.y,STRUCT_R,0,Math.PI*2); ctx.fill();
    // Dashed boundary ring
    ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.globalAlpha=0.35+activeTime*0.30;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.arc(s.x,s.y,STRUCT_R,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    // Center icon — nest: bowl shape; roost: arch/spire
    ctx.fillStyle=col; ctx.globalAlpha=0.85;
    if(isNest){
      // Nest bowl: arc of pixel dots
      for(let i=-3;i<=3;i++) ctx.fillRect(s.x+i*2.5-1,s.y+Math.abs(i)*1.2,2,2);
      ctx.fillRect(s.x-8,s.y+5,16,2.5);
    } else {
      // Roost: vertical bar + cross + spire tip
      ctx.fillRect(s.x-1.5,s.y-9,3,14);
      ctx.fillRect(s.x-6,s.y-2,12,3);
      ctx.fillRect(s.x-1,s.y-11,2,2);
    }
    ctx.globalAlpha=1;
  }
}

function drawMiniMap() {
  const MW=130, MH=Math.round(MW*(WORLD_H/WORLD_W));
  const MX=canvas.width-MW-10, MY=10+72+8; // below the graph
  const sx=MW/WORLD_W, sy=MH/WORLD_H;
  ctx.fillStyle='rgba(2,2,10,0.82)'; ctx.fillRect(MX,MY,MW,MH);
  ctx.strokeStyle='#1a1a2e'; ctx.lineWidth=1; ctx.strokeRect(MX,MY,MW,MH);
  // Fertility zones
  for(const z of fertZones){
    ctx.globalAlpha=0.12;
    ctx.fillStyle='#2a5a2a';
    ctx.beginPath(); ctx.arc(MX+z.x*sx, MY+z.y*sy, z.r*sx, 0, Math.PI*2); ctx.fill();
  }
  // Entities as 1.5px colored dots
  for(const e of entities){
    if(e.dead) continue;
    ctx.globalAlpha=0.75;
    ctx.fillStyle=e.type===TYPE.PLANT?'#2a6a2a':e.type===TYPE.GRAZER?'#2a5a8a':'#8a2a18';
    ctx.fillRect(MX+e.x*sx-0.75, MY+e.y*sy-0.75, 1.5, 1.5);
  }
  // Structures
  for(const s of structures){
    ctx.globalAlpha=0.85;
    ctx.fillStyle=s.type===STRUCT.NEST?'#c8903a':'#9070d0';
    ctx.fillRect(MX+s.x*sx-1.5, MY+s.y*sy-1.5, 3, 3);
  }
  // Viewport rectangle
  ctx.globalAlpha=0.65; ctx.strokeStyle='#8888aa'; ctx.lineWidth=1;
  ctx.strokeRect(MX+cam.x*sx, MY+cam.y*sy, canvas.width*sx, canvas.height*sy);
  ctx.globalAlpha=1;
  // Label
  ctx.fillStyle='#222'; ctx.font='8px monospace';
  ctx.fillText('map', MX+MW-26, MY+MH-3);
}

function drawDayClock() {
  const ni=nightIntensity();
  const p=(tick%DAY_LENGTH)/DAY_LENGTH;
  const CX=canvas.width/2, CY=16, R=9;
  ctx.fillStyle='rgba(2,2,10,0.82)'; ctx.globalAlpha=0.85;
  ctx.beginPath(); ctx.arc(CX,CY,R+5,0,Math.PI*2); ctx.fill();
  // Night fill
  ctx.fillStyle='#0d0d28'; ctx.globalAlpha=0.90;
  ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.fill();
  // Day arc (warm yellow)
  ctx.fillStyle='#c87c10'; ctx.globalAlpha=0.78;
  ctx.beginPath(); ctx.moveTo(CX,CY);
  ctx.arc(CX,CY,R,-Math.PI*0.5,-Math.PI*0.5+p*Math.PI*2,false); ctx.closePath(); ctx.fill();
  // Current-time dot
  const dotA=-Math.PI*0.5+p*Math.PI*2;
  ctx.fillStyle=ni>0.5?'#aaaaff':'#ffe060';
  ctx.globalAlpha=1;
  ctx.beginPath(); ctx.arc(CX+Math.cos(dotA)*R,CY+Math.sin(dotA)*R,2.5,0,Math.PI*2); ctx.fill();
}

// ── Render ─────────────────────────────────────────────────────────────────────
function draw() {
  ctx.fillStyle='#07070f';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Apply camera transform — all world-space drawing goes between save/restore
  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  // Structures (behind everything else)
  drawStructures();

  // Viewport bounds for culling world-space objects (with generous margin)
  const _vx1=cam.x-40, _vx2=cam.x+canvas.width+40;
  const _vy1=cam.y-40, _vy2=cam.y+canvas.height+40;

  // Fertility zones — cached gradients, viewport-culled
  for(let _zi=0;_zi<fertZones.length;_zi++){
    const z=fertZones[_zi];
    if(z.x+z.r<cam.x||z.x-z.r>cam.x+canvas.width||
       z.y+z.r<cam.y||z.y-z.r>cam.y+canvas.height) continue;
    ctx.fillStyle=fertGrads[_zi];
    ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,Math.PI*2); ctx.fill();
  }

  // Nutrients — viewport culled
  for(const n of nutrients){
    if(n.amount<2) continue;
    if(n.x<_vx1||n.x>_vx2||n.y<_vy1||n.y>_vy2) continue;
    ctx.globalAlpha=Math.min(0.20,n.amount/70*0.20);
    ctx.beginPath(); ctx.arc(n.x,n.y,Math.min(28,n.amount*0.35),0,Math.PI*2);
    ctx.fillStyle='#3a8a44'; ctx.fill();
  }
  ctx.globalAlpha=1;

  // Webs
  ctx.setLineDash([]);
  for(const w of webs){
    if(w.x<_vx1||w.x>_vx2||w.y<_vy1||w.y>_vy2) continue;
    ctx.globalAlpha=w.strength*0.30;
    ctx.strokeStyle='#c8c880';
    ctx.lineWidth=0.6;
    const r=w.radius;
    // Radial strands
    for(let a=0;a<Math.PI*2;a+=Math.PI/4){
      ctx.beginPath(); ctx.moveTo(w.x,w.y);
      ctx.lineTo(w.x+Math.cos(a)*r, w.y+Math.sin(a)*r);
      ctx.stroke();
    }
    // Concentric rings at 1/3, 2/3, 1x radius
    for(let ri=1;ri<=3;ri++){
      ctx.beginPath(); ctx.arc(w.x,w.y,r*ri/3,0,Math.PI*2); ctx.stroke();
    }
  }
  ctx.globalAlpha=1;

  // Corpses — viewport culled
  for(const c of corpses){
    if(c.x<_vx1||c.x>_vx2||c.y<_vy1||c.y>_vy2) continue;
    const fade=Math.max(0,1-c.age/CORPSE_LIFE);
    ctx.globalAlpha=fade*0.30;
    ctx.beginPath(); ctx.arc(c.x,c.y,Math.min(11,c.energy*0.14+4),0,Math.PI*2);
    ctx.fillStyle='#787878'; ctx.fill();
    ctx.globalAlpha=fade*0.50;
    ctx.fillStyle='#b0b0b0';
    ctx.fillRect(c.x-3,c.y-0.75,6,1.5); ctx.fillRect(c.x-0.75,c.y-3,1.5,6);
  }
  ctx.globalAlpha=1;

  // Entities — pixel art sprites, viewport-culled (inspected entity always drawn)
  for(const e of entities){
    if(e!==inspected&&(e.x<_vx1||e.x>_vx2||e.y<_vy1||e.y>_vy2)) continue;
    const g=e.genes, t=e.type;
    const immature=t===TYPE.PLANT&&isImmature(e);
    const er=Math.min(1,e.energy/e.maxEnergy);
    const ps=Math.max(1.5, g.size*0.40)*(immature?0.65:1); // pixel block size
    const camoFade=t===TYPE.GRAZER?1-(g.camouflage??0)*0.55:1;

    // Heatmap override
    const hm=heatmap>0?HEATMAP_MODES[heatmap]:null;
    const hmActive=hm&&hm.types.includes(t);
    const hmHSL=hmActive?heatColor(g[hm.gene]??0,hm.lo,hm.hi):null;

    // Soft glow behind the sprite
    ctx.globalAlpha=(immature?0.05:(t===TYPE.PLANT?0.09:er>0.7?0.07+(er-0.7)*0.28:0.07))*camoFade;
    ctx.fillStyle=hmHSL?`hsl(${hmHSL[0]},${hmHSL[1]}%,${hmHSL[2]}%)`:geneColor(t,g,er);
    ctx.beginPath(); ctx.arc(e.x,e.y,g.size*1.9,0,Math.PI*2); ctx.fill();

    // Pixel art body
    ctx.save();
    ctx.translate(e.x,e.y);
    if(t!==TYPE.PLANT){
      const spd=Math.sqrt(e.vx*e.vx+e.vy*e.vy);
      if(spd>0.05) ctx.rotate(Math.atan2(e.vy,e.vx));
    }
    const spr=SPRITES[getArchetype(t,g)];
    for(const [dx,dy,shade] of spr){
      let h,s,lBase;
      if(t===TYPE.PLANT){
        const tox=g.toxicity??0, thr=g.thorns??0;
        let hh=g.hue-tox*185+thr*28; if(hh<0) hh+=360; if(hh>360) hh-=360;
        h=hh; s=immature?46:58+tox*22+thr*12;
        lBase=immature?(42+er*16):(20+er*26);
      } else {
        h=g.hue; s=58+(g.aggression??0)*30; lBase=28+er*32;
      }
      ctx.globalAlpha=(immature?0.58:0.90+er*0.10)*camoFade;
      if(hmHSL){
        const l=shade===2?hmHSL[2]+16:shade===1?hmHSL[2]:Math.max(8,hmHSL[2]-12);
        ctx.fillStyle=`hsl(${hmHSL[0]},90%,${l}%)`;
      } else {
        const l=shade===2?lBase+14:shade===1?lBase:Math.max(8,lBase-13);
        ctx.fillStyle=`hsl(${Math.round(h)},${Math.round(s)}%,${Math.round(l)}%)`;
      }
      ctx.fillRect(dx*ps-ps*0.5, dy*ps-ps*0.5, ps, ps);
    }
    ctx.restore();

    // Burst sprint glow (grazer)
    if((e.burstTimer??0)>0){
      ctx.globalAlpha=0.45*(e.burstTimer/26)*camoFade;
      ctx.fillStyle='#fff8c0';
      ctx.beginPath(); ctx.arc(e.x,e.y,g.size*1.4,0,Math.PI*2); ctx.fill();
    }

    // Poisoned glow
    if((e.poisonedTimer??0)>0){
      ctx.globalAlpha=(e.poisonedTimer/150)*0.40;
      ctx.beginPath(); ctx.arc(e.x,e.y,g.size*1.9,0,Math.PI*2);
      ctx.fillStyle='#b040ff'; ctx.fill();
    }

    // Disease glow
    if(e._diseased){
      ctx.globalAlpha=0.32;
      ctx.beginPath(); ctx.arc(e.x,e.y,g.size*2.1,0,Math.PI*2);
      ctx.fillStyle='#40ff80'; ctx.fill();
    }

    // Blessing glow
    if(e._blessed){
      ctx.globalAlpha=0.25;
      ctx.beginPath(); ctx.arc(e.x,e.y,g.size*2.3,0,Math.PI*2);
      ctx.fillStyle='#ffd060'; ctx.fill();
    }

    // Hunter kick-back flash (orange)
    if((e.hitTimer??0)>0){
      ctx.globalAlpha=(e.hitTimer/25)*0.52;
      ctx.beginPath(); ctx.arc(e.x,e.y,g.size*2.1,0,Math.PI*2);
      ctx.fillStyle='#ff6020'; ctx.fill();
    }

    // Sleeping glow — soft blue/purple halo
    if(e.sleeping){
      ctx.globalAlpha=0.28*camoFade;
      ctx.fillStyle=t===TYPE.GRAZER?'#8888cc':'#703090';
      ctx.beginPath(); ctx.arc(e.x,e.y,g.size*2.5,0,Math.PI*2); ctx.fill();
    }

    // Energy bar (animals only)
    if(t!==TYPE.PLANT){
      const bw=g.size*3.0, bx=e.x-bw/2, by=e.y+g.size+4;
      ctx.globalAlpha=0.55;
      ctx.fillStyle='#111'; ctx.fillRect(bx,by,bw,2);
      ctx.fillStyle=e.fleeing?'#f84':geneColor(t,g,er); ctx.fillRect(bx,by,bw*er,2);
    }
    ctx.globalAlpha=1;
  }

  // Territorial scent marks — viewport culled
  for(const s of scents){
    if(s.x<_vx1||s.x>_vx2||s.y<_vy1||s.y>_vy2) continue;
    ctx.globalAlpha=(1-s.age/SCENT_LIFE)*0.12;
    ctx.fillStyle='#f84';
    ctx.fillRect(s.x-1.5,s.y-1.5,3,3);
  }
  ctx.globalAlpha=1;

  // Spores — viewport culled, Math.round replaces toFixed
  for(const s of spores){
    if(s.x<_vx1||s.x>_vx2||s.y<_vy1||s.y>_vy2) continue;
    const ageFrac=s.age/s.lifetime;
    const fade=ageFrac<0.12?ageFrac/0.12:ageFrac>0.80?(1-ageFrac)/0.20:1;
    const tox=s.genes.toxicity??0;
    let hh=s.genes.hue-tox*185; if(hh<0) hh+=360;
    const _hhr=Math.round(hh);
    ctx.globalAlpha=fade*0.55;
    ctx.fillStyle=`hsl(${_hhr},48%,70%)`;
    ctx.fillRect(s.x-0.75, s.y-1.5,  1.5, 1.5);
    ctx.fillRect(s.x-0.75, s.y,      1.5, 1.5);
    ctx.globalAlpha=fade*0.35;
    ctx.fillStyle=`hsl(${_hhr},42%,52%)`;
    ctx.fillRect(s.x+0.75, s.y,      1.5, 1.5);
  }
  ctx.globalAlpha=1;

  // Inspect panel is drawn in world-space (camera transform still active)
  if(inspected&&!inspected.dead) drawInspect(inspected);

  // Restore from camera transform — HUD elements below are in canvas-space
  ctx.restore();

  // Night sky overlay — covers the viewport
  const _ni=nightIntensity();
  if(_ni>0.02){
    ctx.globalAlpha=_ni*0.40;
    ctx.fillStyle='#03031a';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalAlpha=1;
  }

  drawGraph();
  drawAtmos();
  drawChallenge();
  drawEventLog();
  drawHeatmapLabel();
  drawDayClock();
  drawMiniMap();
}

function drawChallenge() {
  if(!challenge) return;
  const done=challenge.achieved;
  let prog=0, sub='';
  if(challenge.type==='gen'){
    prog=Math.min(1,maxGeneration/challenge.target);
    sub=`gen ${maxGeneration} / ${challenge.target}`;
  } else {
    const elapsed=challenge.sustainStart!==null?tick-challenge.sustainStart:0;
    prog=Math.min(1,elapsed/challenge.target);
    sub=`${elapsed} / ${challenge.target} ticks`;
  }
  const CW=224, CH=30, CX=canvas.width/2-CW/2, CY=canvas.height-68;
  ctx.fillStyle='rgba(2,2,10,0.88)'; ctx.fillRect(CX,CY,CW,CH);
  ctx.fillStyle='#1a1810'; ctx.fillRect(CX+4,CY+17,CW-8,6);
  ctx.fillStyle=done?'#ffd040':'#886610'; ctx.globalAlpha=0.85;
  ctx.fillRect(CX+4,CY+17,(CW-8)*prog,6);
  ctx.globalAlpha=1; ctx.fillStyle=done?'#ffd040':'#665'; ctx.font='9px monospace';
  ctx.fillText(`⚑ ${challenge.label}`,CX+6,CY+12);
  ctx.fillStyle='#444';
  ctx.fillText(done?'complete!':sub,CX+CW-ctx.measureText(done?'complete!':sub).width-6,CY+12);
}

function drawAtmos() {
  const AX=10, AY=10, AW=132, AH=48;
  ctx.fillStyle='rgba(2,2,10,0.82)';
  ctx.fillRect(AX,AY,AW,AH);
  const drawBar=(label,val,color,y)=>{
    ctx.font='9px monospace'; ctx.fillStyle='#333'; ctx.globalAlpha=1;
    ctx.fillText(label,AX+6,y+9);
    const bx=AX+33, bw=72, bh=5, by=y+3;
    ctx.fillStyle='#0a0a18'; ctx.fillRect(bx,by,bw,bh);
    // colour shifts red when near extremes
    const stress=Math.max(0,1-Math.abs(val-0.5)/0.3); // 1=mid, 0=extreme
    ctx.fillStyle=val<0.35?'#f84':val>0.65?color:color;
    ctx.globalAlpha=0.78; ctx.fillRect(bx,by,bw*val,bh);

// ── Population graph ───────────────────────────────────────────────────────────
function drawGraph() {
  if (history.length < 2) return;
  const GW=210, GH=72, GX=canvas.width-GW-10, GY=10, PAD=5;

  // Background
  ctx.fillStyle='rgba(2,2,10,0.82)';
  ctx.fillRect(GX,GY,GW,GH);
  ctx.strokeStyle='#181828'; ctx.lineWidth=1;
  ctx.strokeRect(GX,GY,GW,GH);

  // Grid lines
  ctx.strokeStyle='#0e0e1e'; ctx.lineWidth=1;
  for(let i=1;i<4;i++){
    const y=GY+PAD+(i/4)*(GH-PAD*2);
    ctx.beginPath(); ctx.moveTo(GX+PAD,y); ctx.lineTo(GX+GW-PAD,y); ctx.stroke();
  }

  // Plot each species normalized to its own MAX_POP (so all lines use full height)
  const drawLine = (color, getter, maxVal, fillColor) => {
    const vals = history.map(getter);
    const mx   = Math.max(maxVal, 1);
    const plotH = GH - PAD*2 - 14;  // leave room for labels at bottom
    const plotW = GW - PAD*2;

    // Filled area under the line
    ctx.globalAlpha = 0.07;
    ctx.fillStyle = fillColor;
    ctx.beginPath();
    ctx.moveTo(GX+PAD, GY+PAD+plotH);
    for(let i=0;i<vals.length;i++){
      const x = GX+PAD + (i/(HISTORY_LEN-1))*plotW;
      const y = GY+PAD+plotH - (vals[i]/mx)*plotH;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(GX+PAD+plotW, GY+PAD+plotH);
    ctx.closePath(); ctx.fill();

    // Line
    ctx.globalAlpha = 0.90;
    ctx.strokeStyle = color; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for(let i=0;i<vals.length;i++){
      const x = GX+PAD + (i/(HISTORY_LEN-1))*plotW;
      const y = GY+PAD+plotH - (vals[i]/mx)*plotH;
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.globalAlpha=1;
  };

  drawLine('#3a7a3a', e=>e.p, MAX_POP[0], '#3a7a3a');
  drawLine('#4af',    e=>e.g, MAX_POP[1], '#4af');
  drawLine('#f52',    e=>e.h, MAX_POP[2], '#f52');

  // Current counts
  const last = history[history.length-1];
  ctx.font='9px monospace';
  const items = [
    ['#3a7a3a', `P ${last.p}`, 0],
    ['#4af',    `G ${last.g}`, 44],
    ['#f52',    `H ${last.h}`, 82],
  ];
  items.forEach(([col, text, ox]) => {
    ctx.fillStyle=col; ctx.globalAlpha=0.9;
    ctx.fillText(text, GX+PAD+ox, GY+GH-4);
  });
  ctx.globalAlpha=1;

  // "history" label
  ctx.fillStyle='#222'; ctx.font='8px monospace';
  ctx.fillText('population', GX+GW-68, GY+10);
}

// ── Inspect panel ──────────────────────────────────────────────────────────────
let inspected = null;
let inspectButtons = [];

function drawInspect(e) {
  inspectButtons = [];
  const r=e.genes.size, er=Math.min(1,e.energy/e.maxEnergy);
  const immature=e.type===TYPE.PLANT&&isImmature(e);
  const color=immature
    ?`hsl(${e.genes.hue-20},46%,${(42+er*16).toFixed(0)}%)`
    :geneColor(e.type,e.genes,er);

  // Selection ring
  ctx.save();
  ctx.setLineDash([4,3]); ctx.lineWidth=1.5; ctx.strokeStyle='#eee'; ctx.globalAlpha=0.8;
  ctx.beginPath(); ctx.arc(e.x,e.y,r+5,0,Math.PI*2); ctx.stroke();
  if(e.genes.senseRadius){
    ctx.lineWidth=1; ctx.strokeStyle=color; ctx.globalAlpha=0.15;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.genes.senseRadius,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();

  const g=e.genes, spec=GENE_SPEC[e.type];
  const isAnimal=e.type!==TYPE.PLANT;
  const panelH=isAnimal?(e.type===TYPE.GRAZER?216:203):183;
  const px=Math.min(e.x+r+14, cam.x+canvas.width-189);
  const py=clamp(e.y-60, cam.y+8, cam.y+canvas.height-panelH-8);

  ctx.fillStyle='rgba(3,3,11,0.92)'; ctx.strokeStyle='#1a1a2e'; ctx.lineWidth=1;
  ctx.fillRect(px,py,185,panelH); ctx.strokeRect(px,py,185,panelH);

  let iy=py+14;
  ctx.font='10px monospace';

  // Header — archetype label (rabbit / deer / big cat / etc.) replaces generic type name
  const _arch=getArchetype(e.type,e.genes);
  ctx.fillStyle=color;
  ctx.fillText(immature?'PLANT  ◆ seedling':(ARCHETYPE_NAMES[_arch]||['PLANT','GRAZER','HUNTER','SPIDER'][e.type]).toUpperCase(), px+7, iy); iy+=13;
  ctx.fillStyle='#444';
  ctx.fillText(`gen ${e.generation}  ·  age ${e.age}`, px+7, iy); iy+=11;
  ctx.fillStyle='#181828';
  ctx.fillRect(px+7, iy, 171, 1); iy+=8;

  // Gene rows with bar + optional [-][+] edit buttons
  const drawGeneRow = (label, val, lo, hi, col, key=null) => {
    const frac=clamp((val-lo)/(hi-lo),0,1);
    const bx=px+7, bw=66, bh=3, by=iy-4;
    ctx.fillStyle='#121220'; ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle=col; ctx.globalAlpha=0.75;
    ctx.fillRect(bx,by,frac*bw,bh);
    ctx.globalAlpha=1;
    ctx.fillStyle='#3a3a50'; ctx.font='9px monospace';
    ctx.fillText(label, bx+bw+5, iy);
    ctx.fillStyle=col;
    ctx.fillText(val.toFixed(2), bx+bw+57, iy);
    if(key!==null){
      const bh2=9, bw2=8, by2=iy-8, bx1=px+168, bx2=px+177;
      ctx.fillStyle='#1a1a30';
      ctx.fillRect(bx1,by2,bw2,bh2); ctx.fillRect(bx2,by2,bw2,bh2);
      ctx.strokeStyle='#3a3a60'; ctx.lineWidth=0.5;
      ctx.strokeRect(bx1,by2,bw2,bh2); ctx.strokeRect(bx2,by2,bw2,bh2);
      ctx.fillStyle='#90a0c8'; ctx.font='9px monospace';
      ctx.fillText('−',bx1+1,by2+7); ctx.fillText('+',bx2+1,by2+7);
      inspectButtons.push({key,delta:-1,x:bx1,y:by2,w:bw2,h:bh2,lo,hi});
      inspectButtons.push({key,delta:+1,x:bx2,y:by2,w:bw2,h:bh2,lo,hi});
    }
    iy+=13;
  };

  ctx.font='9px monospace';
  if(e.type===TYPE.PLANT){
    drawGeneRow('growth',  g.growthRate,   ...spec.growthRate.slice(1),   '#4b4',      'growthRate');
    drawGeneRow('spread',  g.spreadChance, ...spec.spreadChance.slice(1), '#4b4',      'spreadChance');
    drawGeneRow('spores',  g.sporeChance,  ...spec.sporeChance.slice(1),  '#ad4',      'sporeChance');
    drawGeneRow('toxin',   g.toxicity,     ...spec.toxicity.slice(1),     '#c06fe0',   'toxicity');
    drawGeneRow('thorns',  g.thorns??0,    ...spec.thorns.slice(1),        '#d4c040',  'thorns');
    drawGeneRow('size',    g.size,         ...spec.size.slice(1),          '#aaa',     'size');
    drawGeneRow('mutRate', g.mutationRate, ...spec.mutationRate.slice(1),  '#b84',     'mutationRate');
    drawGeneRow('hue',     g.hue,          ...spec.hue.slice(1),           '#888',     'hue');
  } else {
    const ageFrac=e.age/(g.size*1800);
    drawGeneRow('speed',   g.speed,        ...spec.speed.slice(1),        '#7af',      'speed');
    drawGeneRow('sense',   g.senseRadius,  ...spec.senseRadius.slice(1),  '#7af',      'senseRadius');
    drawGeneRow('size',    g.size,         ...spec.size.slice(1),          '#aaa',     'size');
    drawGeneRow('metab',   g.metabolism,   ...spec.metabolism.slice(1),   '#fa6',      'metabolism');
    drawGeneRow('fert',    g.fertility,    ...spec.fertility.slice(1),     '#4c4',     'fertility');
    drawGeneRow('aggr',    g.aggression,   ...spec.aggression.slice(1),   g.aggression>0.6?'#f64':'#48f', 'aggression');
    if(e.type===TYPE.HUNTER){
      drawGeneRow('stealth',   g.stealth??0,   ...spec.stealth.slice(1),   '#88c4f8', 'stealth');
      drawGeneRow('nocturnal', g.nocturnal??0, ...spec.nocturnal.slice(1), '#9060d8', 'nocturnal');
    }
    if(e.type===TYPE.GRAZER){
      drawGeneRow('resist',  g.poisonResistance, ...spec.poisonResistance.slice(1), '#b06aff', 'poisonResistance');
      drawGeneRow('stamina', g.stamina,          ...spec.stamina.slice(1),          '#ffd040', 'stamina');
      drawGeneRow('camo',    g.camouflage,       ...spec.camouflage.slice(1),       '#80c8a0', 'camouflage');
    }
    drawGeneRow('mutRate', g.mutationRate, ...spec.mutationRate.slice(1), '#b84',     'mutationRate');
    // Age bar — display only, no edit
    const agCol=ageFrac>0.7?'#f84':'#444';
    drawGeneRow('age',     ageFrac*100,    0, 100,                         agCol);
  }

  // Lineage panel — gene delta sparklines from oldest ancestor to now
  if(e.ancestors && e.ancestors.length > 0){
    const chain=[...e.ancestors,{gen:e.generation,genes:e.genes}];
    const geneKeys=e.type===TYPE.PLANT
      ?[{k:'toxicity',c:'#c06fe0'},{k:'size',c:'#aaa'},{k:'growthRate',c:'#4b4'}]
      :[{k:'speed',c:'#7af'},{k:'aggression',c:'#f64'},{k:'size',c:'#aaa'}];
    const LH=geneKeys.length*18+22, lx=px, ly=py+panelH+4;
    ctx.fillStyle='rgba(3,3,11,0.90)'; ctx.strokeStyle='#1a1a2e'; ctx.lineWidth=1;
    ctx.fillRect(lx,ly,185,LH); ctx.strokeRect(lx,ly,185,LH);
    ctx.fillStyle='#2a2a3a'; ctx.font='9px monospace';
    ctx.fillText(`lineage  gen ${chain[0].gen} → ${e.generation}`,lx+7,ly+12);
    ctx.fillStyle='#181828'; ctx.fillRect(lx+7,ly+15,171,1);
    let ry=ly+28;
    for(const {k,c} of geneKeys){
      const vals=chain.map(a=>a.genes[k]??0);
      const lo=Math.min(...vals), hi=Math.max(...vals), rng=hi-lo||0.001;
      // label
      ctx.fillStyle='#3a3a50'; ctx.font='9px monospace';
      ctx.fillText(k.substring(0,5),lx+7,ry);
      // sparkline
      const sx=lx+50, sw=62, sh=8;
      ctx.fillStyle='#0d0d1a'; ctx.fillRect(sx,ry-sh+2,sw,sh);
      ctx.strokeStyle=c; ctx.lineWidth=1; ctx.globalAlpha=0.7;
      ctx.beginPath();
      vals.forEach((v,i)=>{
        const x=sx+(i/(vals.length-1))*sw;
        const y=(ry-sh+2)+sh*(1-(v-lo)/rng);
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      });
      ctx.stroke(); ctx.globalAlpha=1;
      // delta
      const delta=vals[vals.length-1]-vals[0];
      const sign=delta>0?'+':'';
      ctx.fillStyle=delta>0.01?'#4f4':delta<-0.01?'#f64':'#555';
      ctx.font='8px monospace';
      ctx.fillText(`${sign}${delta.toFixed(2)}`,lx+118,ry);
      ry+=18;
    }
  }
}

// ── Loop ──────────────────────────────────────────────────────────────────────
let paused=false, simSpeed=1;

let _frameN=0;
function loop() {
  if(!paused){
    for(let i=0;i<simSpeed;i++) step();
    recordHistory();
    const drawEvery=simSpeed>=16?3:simSpeed>=8?2:1;
    if(++_frameN%drawEvery===0){ draw(); updateStats(); }
  }
  requestAnimationFrame(loop);
}

  speed:[0.3,3.6,0.05,2], senseRadius:[18,180,2,0], metabolism:[0.3,2.4,0.03,2],
  fertility:[0.4,2.4,0.03,2], aggression:[0.0,1.0,0.02,2], poisonResistance:[0.0,1.0,0.02,2],
  stamina:[0.3,2.8,0.03,2], camouflage:[0.0,0.90,0.02,2], stealth:[0.0,0.85,0.02,2],

function dpUpdateGeneList() {
  const genes = DISEASE_GENES[dpTarget.value] || DISEASE_GENES['-1'];
  dpGene.innerHTML = genes.map(k=>`<option value="${k}">${GENE_DISPLAY[k]||k}</option>`).join('');
  dpUpdateThreshRange();
}
function dpUpdateThreshRange() {
  const r = GENE_RANGES[dpGene.value];
  if (!r) return;
  dpThresh.min = r[0]; dpThresh.max = r[1]; dpThresh.step = r[2];
  const mid = ((r[0]+r[1])/2);
  dpThresh.value = mid;
  dpThreshV.textContent = mid.toFixed(r[3]);
}
function dpRenderList() {
  if (!diseases.length) { dpList.innerHTML = '<span class="no-dis">none</span>'; return; }
  dpList.innerHTML = diseases.map(d=>{
    const r = GENE_RANGES[d.gene];
    const tv = r ? Number(d.threshold).toFixed(r[3]) : d.threshold;
    return `<div class="dis-item">
      <span class="dis-name">${TARGET_LABELS[d.targetType]}<br>
        ${GENE_DISPLAY[d.gene]||d.gene} ${d.cond} ${tv}<br>
        → ${EFFECT_LABELS[d.effect]} ${Math.round(d.severity*100)}%</span>
      <span class="dis-del" data-id="${d.id}">✕</span>
    </div>`;
  }).join('');
  dpList.querySelectorAll('.dis-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = parseInt(btn.dataset.id);
      diseases = diseases.filter(d=>d.id!==id);
      dpRenderList();
    });
  });
}
