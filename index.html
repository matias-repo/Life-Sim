<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biosphere</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #07070f; color: #ccc; font-family: monospace;
         display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
  h1 { font-size: 0.9rem; letter-spacing: 5px; padding: 6px 0; color: #4af; opacity: 0.6; flex-shrink: 0; }
  #world { display: block; cursor: crosshair; flex-shrink: 0; }
  #ui { display: flex; gap: 8px; padding: 6px; flex-wrap: wrap; justify-content: center; flex-shrink: 0; }
  button { padding: 5px 13px; border: 1px solid; border-radius: 3px; background: transparent;
           font-family: monospace; font-size: 0.78rem; cursor: pointer; transition: background 0.12s; }
  .btn-plant  { color: #4c4; border-color: #4c4; } .btn-plant:hover  { background: #4c41; }
  .btn-grazer { color: #4af; border-color: #4af; } .btn-grazer:hover { background: #4af1; }
  .btn-hunter { color: #f64; border-color: #f64; } .btn-hunter:hover { background: #f641; }
  .btn-clear  { color: #666; border-color: #444; } .btn-clear:hover  { background: #2221; }
  .btn-pause  { color: #fa4; border-color: #fa4; }
  #stats { font-size: 0.72rem; color: #444; padding: 2px 8px; letter-spacing: 1px; flex-shrink: 0; }
</style>
</head>
<body>
<h1>B I O S P H E R E</h1>
<canvas id="world"></canvas>
<div id="ui">
  <button class="btn-plant"  id="selPlant">+ Plant</button>
  <button class="btn-grazer" id="selGrazer">+ Grazer</button>
  <button class="btn-hunter" id="selHunter">+ Hunter</button>
  <button class="btn-pause"  id="btnPause">Pause</button>
  <button class="btn-clear"  id="btnClear">Clear</button>
</div>
<div id="stats">–</div>

<script>
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');

// Defer sizing until the browser has laid out the page so offsetHeight is accurate
function resize() {
  const h1H    = document.querySelector('h1').offsetHeight    || 28;
  const uiH    = document.getElementById('ui').offsetHeight   || 44;
  const statsH = document.getElementById('stats').offsetHeight || 22;
  canvas.width  = Math.min(window.innerWidth - 2, 960);
  canvas.height = Math.max(window.innerHeight - h1H - uiH - statsH - 16, 280);
}
window.addEventListener('resize', resize);

// ── Types ──────────────────────────────────────────────────────────────────────
const TYPE = { PLANT: 0, GRAZER: 1, HUNTER: 2 };

// Gene spec: { name: [default, min, max] }
const GENE_SPEC = {
  [TYPE.PLANT]: {
    growthRate:   [0.11,  0.02,  0.30 ],
    size:         [4.0,   2.0,   9.0  ],
    spreadChance: [0.003, 0.0004,0.010],  // raised: plants must keep up with grazers
    mutationRate: [0.08,  0.01,  0.50 ],
    hue:          [120,   72,    162  ],
  },
  [TYPE.GRAZER]: {
    speed:        [1.2,   0.3,   3.0  ],
    size:         [5.0,   2.5,   11.0 ],
    senseRadius:  [60,    18,    150  ],
    metabolism:   [1.0,   0.3,   2.4  ],
    fertility:    [1.0,   0.4,   2.4  ],
    aggression:   [0.4,   0.0,   1.0  ],
    mutationRate: [0.08,  0.01,  0.50 ],
    hue:          [210,   172,   268  ],
  },
  [TYPE.HUNTER]: {
    speed:        [1.6,   0.5,   3.6  ],
    size:         [6.0,   3.5,   13.0 ],
    senseRadius:  [100,   28,    180  ],
    metabolism:   [1.0,   0.3,   2.4  ],
    fertility:    [1.0,   0.4,   2.4  ],
    aggression:   [0.7,   0.0,   1.0  ],
    mutationRate: [0.08,  0.01,  0.50 ],
    hue:          [15,    0,     58   ],
  },
};

const EP = {
  [TYPE.PLANT]:  { start: 65,  maxBase: 120, repBase: 76,  costBase: 45 },  // repBase lowered: plants spread sooner
  [TYPE.GRAZER]: { start: 80,  maxBase: 185, repBase: 148, costBase: 65 },
  [TYPE.HUNTER]: { start: 100, maxBase: 255, repBase: 210, costBase: 90 },
};

const SIZE_DEF  = { [TYPE.PLANT]: 4, [TYPE.GRAZER]: 5, [TYPE.HUNTER]: 6 };
const MAX_ENTITIES = 450;
// Per-species soft caps prevent one type from crowding out others
const MAX_POP   = [260, 160, 45];

// ── Math helpers ───────────────────────────────────────────────────────────────
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function gauss() {
  let u = 0, v = 0;
  while (!u) u = Math.random();
  while (!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function dist2(a, b) { const dx=a.x-b.x, dy=a.y-b.y; return dx*dx+dy*dy; }
function dist(a, b)  { return Math.sqrt(dist2(a,b)); }

// ── Genes ──────────────────────────────────────────────────────────────────────
function defaultGenes(type) {
  const g = {};
  for (const [k, [def]] of Object.entries(GENE_SPEC[type])) g[k] = def;
  return g;
}

function mutateGenes(parentGenes, type) {
  const spec = GENE_SPEC[type];
  const mr   = parentGenes.mutationRate;
  const child = {};
  for (const [k, [, lo, hi]] of Object.entries(spec)) {
    const pv = parentGenes[k];
    if (k === 'mutationRate') {
      child[k] = clamp(pv + gauss() * 0.016, lo, hi);
    } else if (k === 'hue') {
      child[k] = clamp(pv + gauss() * mr * 38, lo, hi);
    } else {
      child[k] = clamp(pv * (1 + gauss() * mr * 0.5), lo, hi);
    }
  }
  return child;
}

// ── Derived stats ──────────────────────────────────────────────────────────────
function energyMax(type, g)    { return EP[type].maxBase  * (g.size / SIZE_DEF[type]); }
function repThreshold(type, g) { return EP[type].repBase  * (g.size / SIZE_DEF[type]) / (g.fertility ?? 1); }
function repCost(type, g)      { return EP[type].costBase * (g.size / SIZE_DEF[type]); }
function metabolicRate(g)      { return (g.speed*g.speed*0.016 + g.size*0.0024 + 0.005) * g.metabolism; }

function geneColor(type, g, energyRatio) {
  if (type === TYPE.PLANT) {
    return `hsl(${g.hue},58%,${(20 + energyRatio*24).toFixed(0)}%)`;
  }
  return `hsl(${g.hue},${(58+g.aggression*30).toFixed(0)}%,${(28+energyRatio*30).toFixed(0)}%)`;
}

// ── Entities ───────────────────────────────────────────────────────────────────
let idCounter = 0;

function createEntity(type, x, y, genes = null, generation = 0) {
  const g = genes ?? defaultGenes(type);
  return {
    id: idCounter++, type, x, y,
    vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4,
    genes: g,
    energy: EP[type].start,
    maxEnergy: energyMax(type, g),
    age: 0, dead: false, target: null, generation, fleeing: false,
  };
}

function spawnOffspring(parent) {
  const t = parent.type;
  const g = mutateGenes(parent.genes, t);
  const angle = Math.random() * Math.PI * 2;
  const d = parent.genes.size * 3.5;
  const x = clamp(parent.x + Math.cos(angle)*d, 5, canvas.width -5);
  const y = clamp(parent.y + Math.sin(angle)*d, 5, canvas.height-5);
  const child = createEntity(t, x, y, g, parent.generation+1);
  child.maxEnergy = energyMax(t, g);
  child.energy    = EP[t].start * 0.6;
  return child;
}

function spawnRandom(type) {
  return createEntity(type,
    Math.random()*(canvas.width -20)+10,
    Math.random()*(canvas.height-20)+10,
  );
}

let entities = [];

function seed() {
  for (let i = 0; i < 55; i++) entities.push(spawnRandom(TYPE.PLANT));
  for (let i = 0; i < 12; i++) entities.push(spawnRandom(TYPE.GRAZER));
  for (let i = 0; i <  2; i++) entities.push(spawnRandom(TYPE.HUNTER));
}

// ── Spatial grid + population count ───────────────────────────────────────────
const CELL = 80;
let grid = {};
let popCount = [0, 0, 0];  // live count per type, updated each tick in buildGrid

function buildGrid() {
  grid = {};
  popCount[0] = popCount[1] = popCount[2] = 0;
  for (const e of entities) {
    if (e.dead) continue;
    popCount[e.type]++;
    const k = `${Math.floor(e.x/CELL)}_${Math.floor(e.y/CELL)}`;
    if (!grid[k]) grid[k] = [];
    grid[k].push(e);
  }
}

function nearby(x, y, r) {
  const out = [];
  const cx = Math.floor(x/CELL), cy = Math.floor(y/CELL), cr = Math.ceil(r/CELL)+1;
  for (let dx=-cr; dx<=cr; dx++)
    for (let dy=-cr; dy<=cr; dy++) {
      const b = grid[`${cx+dx}_${cy+dy}`];
      if (b) for (const e of b) out.push(e);
    }
  return out;
}

// ── Nutrients ──────────────────────────────────────────────────────────────────
const MAX_NUTRIENTS = 80;
let nutrients = [];
function addNutrient(x, y, amount) {
  if (nutrients.length < MAX_NUTRIENTS) nutrients.push({ x, y, amount });
}

// ── Simulation ─────────────────────────────────────────────────────────────────
let newborns = [];

function stepPlant(e) {
  let bonus = 0;
  for (const n of nutrients) {
    const dx=e.x-n.x, dy=e.y-n.y, d2=dx*dx+dy*dy;
    if (d2 < 1444) bonus += n.amount * (1 - Math.sqrt(d2)/38) * 0.5;  // 38² = 1444
  }
  e.energy = Math.min(e.maxEnergy, e.energy + e.genes.growthRate*(1+bonus));

  if (e.age > 4000 + e.genes.size*800) {
    addNutrient(e.x, e.y, e.genes.size*2.5);
    e.dead = true; return;
  }

  const rt = repThreshold(TYPE.PLANT, e.genes);
  const rc = repCost(TYPE.PLANT, e.genes);
  if (popCount[TYPE.PLANT] < MAX_POP[TYPE.PLANT]
      && entities.length + newborns.length < MAX_ENTITIES
      && e.energy > rt && Math.random() < e.genes.spreadChance) {
    e.energy -= rc;
    newborns.push(spawnOffspring(e));
  }
}

function stepAnimal(e) {
  const g = e.genes, t = e.type;

  const lifespan = g.size * 1800;
  const ageFrac  = e.age / lifespan;
  if (ageFrac >= 1) {
    addNutrient(e.x, e.y, g.size*2);
    e.dead = true; return;
  }
  const speedMult = ageFrac > 0.7 ? Math.max(0.2, 1-(ageFrac-0.7)*2.2) : 1;
  const effSpeed  = g.speed * speedMult;
  const canReproduce = ageFrac < 0.78;

  const eatType  = t === TYPE.GRAZER ? TYPE.PLANT  : TYPE.GRAZER;
  const predType = t === TYPE.GRAZER ? TYPE.HUNTER : null;

  // Flee
  e.fleeing = false;
  if (predType !== null && g.aggression < 0.72) {
    const fleeR  = g.senseRadius * (1.15 - g.aggression*0.45);
    const threats = nearby(e.x, e.y, fleeR).filter(n => !n.dead && n.type === predType);
    if (threats.length) {
      const threat = threats.reduce((b,n) => dist2(e,n)<dist2(e,b)?n:b);
      const d = dist(e, threat) || 1;
      e.vx = (e.x-threat.x)/d * effSpeed;
      e.vy = (e.y-threat.y)/d * effSpeed;
      e.fleeing = true;
      e.target  = null;
    }
  }

  if (!e.fleeing) {
    const lostTarget = !e.target || e.target.dead
                    || dist2(e, e.target) > (g.senseRadius*1.6)**2;
    if (lostTarget) {
      e.target = null;
      const cands = nearby(e.x, e.y, g.senseRadius)
        .filter(n => n!==e && !n.dead && n.type===eatType);
      if (cands.length) e.target = cands.reduce((b,n) => dist2(e,n)<dist2(e,b)?n:b);
    }

    if (e.target && !e.target.dead) {
      const d = dist(e, e.target) || 1;
      const chaseR = g.senseRadius * (0.4 + g.aggression*0.75);
      if (d < chaseR) {
        e.vx = (e.target.x-e.x)/d * effSpeed;
        e.vy = (e.target.y-e.y)/d * effSpeed;
      } else {
        e.target = null;
      }

      if (e.target && d < g.size + e.target.genes.size + 1.5) {
        if (eatType === TYPE.PLANT) {
          // Graze: bite a chunk — plant survives repeated bites, only dies when drained
          const bite = Math.min(e.target.energy * 0.38, 26);
          if (bite > 1) {
            e.energy = Math.min(e.maxEnergy, e.energy + bite*(0.62+g.aggression*0.10));
            e.target.energy -= bite;
            if (e.target.energy < 5) {
              addNutrient(e.target.x, e.target.y, e.target.energy);
              e.target.dead = true;
            }
            e.target = null;
          }
        } else {
          // Kill: hunters consume entire prey
          const gain = e.target.energy * (0.55+g.aggression*0.12);
          e.energy = Math.min(e.maxEnergy, e.energy + gain);
          addNutrient(e.target.x, e.target.y, e.target.energy*0.3);
          e.target.dead = true;
          e.target = null;
        }
      }
    } else {
      e.vx += (Math.random()-0.5)*0.33;
      e.vy += (Math.random()-0.5)*0.33;
      const spd = Math.sqrt(e.vx*e.vx+e.vy*e.vy);
      if (spd > effSpeed*0.85) { const s=effSpeed*0.85/spd; e.vx*=s; e.vy*=s; }
    }
  }

  e.x += e.vx; e.y += e.vy;

  const r = g.size;
  if (e.x < r)              { e.x=r;              e.vx*=-0.8; }
  if (e.x > canvas.width-r) { e.x=canvas.width-r; e.vx*=-0.8; }
  if (e.y < r)              { e.y=r;              e.vy*=-0.8; }
  if (e.y > canvas.height-r){ e.y=canvas.height-r; e.vy*=-0.8; }

  e.energy -= metabolicRate(g);
  if (e.energy <= 0) {
    addNutrient(e.x, e.y, g.size*2.5);
    e.dead = true; return;
  }

  const rt = repThreshold(t, g);
  const rc = repCost(t, g);
  if (canReproduce
      && popCount[t] < MAX_POP[t]
      && entities.length + newborns.length < MAX_ENTITIES
      && e.energy > rt) {
    e.energy -= rc;
    newborns.push(spawnOffspring(e));
  }
}

// Runs every tick — cheap because popCount is already computed
function checkExtinction() {
  if (popCount[0] < 5)   for (let i=0; i<12; i++) entities.push(spawnRandom(TYPE.PLANT));
  if (popCount[1] < 2)   for (let i=0; i< 6; i++) entities.push(spawnRandom(TYPE.GRAZER));
  if (popCount[2] === 0)                           entities.push(spawnRandom(TYPE.HUNTER));
}

function step() {
  buildGrid();       // also resets popCount
  newborns = [];
  for (const e of entities) {
    if (e.dead) continue;
    e.age++;
    if (e.type === TYPE.PLANT) stepPlant(e);
    else stepAnimal(e);
  }
  nutrients = nutrients.filter(n => { n.amount *= 0.997; return n.amount > 0.7; });
  entities  = entities.filter(e => !e.dead);
  entities.push(...newborns);
  checkExtinction();
}

// ── Render ─────────────────────────────────────────────────────────────────────
function draw() {
  ctx.fillStyle = '#07070f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const n of nutrients) {
    if (n.amount < 2) continue;
    const a = Math.min(0.20, n.amount/70*0.20);
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(n.x, n.y, Math.min(28, n.amount*0.35), 0, Math.PI*2);
    ctx.fillStyle = '#3a8a44';
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const e of entities) {
    const r  = e.genes.size;
    const er = Math.min(1, e.energy / e.maxEnergy);
    const color = geneColor(e.type, e.genes, er);

    const glowA = e.type===TYPE.PLANT ? 0.10 : (er>0.7 ? 0.08+(er-0.7)*0.35 : 0.08);
    ctx.globalAlpha = glowA;
    ctx.beginPath(); ctx.arc(e.x, e.y, r*2.3, 0, Math.PI*2);
    ctx.fillStyle = color; ctx.fill();

    ctx.globalAlpha = 0.82 + er*0.18;
    ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI*2);
    ctx.fillStyle = color; ctx.fill();

    if (e.type === TYPE.HUNTER) {
      ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.arc(e.x, e.y, r*0.4, 0, Math.PI*2);
      ctx.fillStyle = `hsl(${e.genes.hue},100%,80%)`; ctx.fill();
    }

    if (e.type !== TYPE.PLANT) {
      const bw = r*2.5;
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = '#111';
      ctx.fillRect(e.x-bw/2, e.y-r-5, bw, 2);
      ctx.fillStyle = e.fleeing ? '#f84' : color;
      ctx.fillRect(e.x-bw/2, e.y-r-5, bw*er, 2);
    }
  }
  ctx.globalAlpha = 1;

  if (inspected && !inspected.dead) drawInspect(inspected);
}

// ── Inspect ────────────────────────────────────────────────────────────────────
let inspected = null;

function drawInspect(e) {
  const r  = e.genes.size;
  const er = Math.min(1, e.energy/e.maxEnergy);
  const color = geneColor(e.type, e.genes, er);

  ctx.save();
  ctx.setLineDash([4,3]);
  ctx.lineWidth = 1.5; ctx.strokeStyle = '#eee'; ctx.globalAlpha = 0.8;
  ctx.beginPath(); ctx.arc(e.x, e.y, r+5, 0, Math.PI*2); ctx.stroke();
  if (e.genes.senseRadius) {
    ctx.lineWidth = 1; ctx.strokeStyle = color; ctx.globalAlpha = 0.18;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.genes.senseRadius, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();

  const g = e.genes;
  const panelH = e.type===TYPE.PLANT ? 136 : 174;
  const px = Math.min(e.x+r+14, canvas.width -164);
  const py = clamp(e.y-60, 8, canvas.height-panelH-8);

  ctx.fillStyle = 'rgba(4,4,12,0.88)'; ctx.strokeStyle = '#1e1e2e'; ctx.lineWidth = 1;
  ctx.fillRect(px,py,160,panelH); ctx.strokeRect(px,py,160,panelH);

  ctx.font = '10px monospace';
  let iy = py+14;
  const line = (txt,col) => { ctx.fillStyle=col; ctx.fillText(txt,px+7,iy); iy+=13; };

  line(['PLANT','GRAZER','HUNTER'][e.type], color);
  line(`gen ${e.generation}  ·  age ${e.age}`, '#555');
  line('──────────────────', '#222');

  if (e.type === TYPE.PLANT) {
    line(`growth    ${g.growthRate.toFixed(3)}`, '#4b4');
    line(`spread    ${g.spreadChance.toFixed(4)}`, '#4b4');
    line(`size      ${g.size.toFixed(2)}`, '#aaa');
    line(`mutRate   ${g.mutationRate.toFixed(3)}`, '#b84');
    line(`hue       ${g.hue.toFixed(0)}°`, '#888');
  } else {
    // Fixed: use actual lifespan formula (size*1800) not the old size*480
    const agePct = ((e.age / (g.size*1800)) * 100).toFixed(0);
    line(`speed     ${g.speed.toFixed(2)}`,       '#7af');
    line(`sense     ${g.senseRadius.toFixed(1)}`, '#7af');
    line(`size      ${g.size.toFixed(2)}`,         '#aaa');
    line(`metab     ${g.metabolism.toFixed(2)}`,  '#fa6');
    line(`fertility ${g.fertility.toFixed(2)}`,   '#4c4');
    line(`aggr      ${g.aggression.toFixed(2)}`,  g.aggression>0.6?'#f64':'#48f');
    line(`mutRate   ${g.mutationRate.toFixed(3)}`, '#b84');
    line(`age       ${agePct}%`,                  '#555');
  }
}

// ── Stats ──────────────────────────────────────────────────────────────────────
let tick = 0;
function updateStats() {
  if (tick++ % 20 !== 0) return;
  document.getElementById('stats').textContent =
    `plants: ${popCount[0]}  ·  grazers: ${popCount[1]}  ·  hunters: ${popCount[2]}  ·  total: ${entities.length}`;
}

// ── Loop ──────────────────────────────────────────────────────────────────────
let paused = false;
function loop() {
  if (!paused) { step(); draw(); updateStats(); }
  requestAnimationFrame(loop);
}

// ── Controls ───────────────────────────────────────────────────────────────────
let selected = null;
const TYPE_BTNS = { selPlant: TYPE.PLANT, selGrazer: TYPE.GRAZER, selHunter: TYPE.HUNTER };
const btnEls = {};

Object.entries(TYPE_BTNS).forEach(([id, type]) => {
  const btn = document.getElementById(id);
  btnEls[id] = btn;
  btn.addEventListener('click', () => {
    selected = selected===type ? null : type;
    Object.entries(btnEls).forEach(([bid,b]) =>
      b.style.opacity = (selected===null||selected===TYPE_BTNS[bid]) ? '1' : '0.38'
    );
  });
});

canvas.addEventListener('click', ev => {
  const rect = canvas.getBoundingClientRect();
  const mx = ev.clientX-rect.left, my = ev.clientY-rect.top;
  const pt = {x:mx,y:my};
  for (let i=entities.length-1; i>=0; i--) {
    const e = entities[i];
    if (!e.dead && dist(pt,e) < e.genes.size+6) {
      inspected = inspected===e ? null : e; return;
    }
  }
  if (selected !== null) {
    inspected = null;
    for (let i=0; i<3; i++) {
      const x=clamp(mx+(Math.random()-0.5)*30,5,canvas.width-5);
      const y=clamp(my+(Math.random()-0.5)*30,5,canvas.height-5);
      entities.push(createEntity(selected,x,y));
    }
  }
});

document.getElementById('btnPause').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('btnPause').textContent = paused ? 'Resume' : 'Pause';
});
document.getElementById('btnClear').addEventListener('click', () => {
  entities=[]; nutrients=[]; inspected=null;
});

// Init: resize first, then seed, then start loop
resize();
seed();
loop();
</script>
</body>
</html>
